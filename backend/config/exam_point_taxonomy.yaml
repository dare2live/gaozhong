# 考点 canonical 分类体系 (件2 地基) — 数据化判断规则 (§3.5 不 hardcode)
#
# 2026-06-16 细化 (回应用户"太粗/考纲就是这么分类的吗"): 升到官方层级 + 每 label 带 provenance。
# 每分类 provenance 标 🟢官方/🟡实证/🔴民间 (本文件内 provenance 字段即真相源, 锚课标官方层级)。
#
# provenance 取值 (§3.2 可信度分层, moth 锁"🟡不冒充🟢"):
#   official_curriculum — 普通高中英语课程标准(2017年版2020修订), 课标逐字
#   official_neea       — 教育部考试中心《中国高考评价体系》/官方考试说明
#   empirical_liaoning  — 本项目辽宁真题实证归纳 (非考纲明列, 诚实标注)
#   convention          — 教辅通用名/民间约定 (映射到官方, 不单独入 canonical)
#
# 标注落 nodes(node_type=exam_point) + edges(tests_exam_point), evidence_json 带 provenance+confidence。
# 真相源: theme_contexts.jsonl(13行, 课标L1/L2逐字, 清杜撰L3后) + grammar_items.jsonl(106) + 上述官方文件。

version: 2
status: draft  # 细化标注落库前为 draft

dimensions:

  # 维度 1: 主题语境 (课标官方仅两级可枚举: 3大主题语境(L1) → 10主题群(L2); canonical 用到 L2)
  #   注: 课标"第三级"是32条段落式"内容要求"(只挂L1、一句含多概念), 非子主题词条; 曾杜撰35个L3已废(2026-06-21)。
  theme_context:
    desc: 课标官方主题语境层级 (本表 L1+L2 与课标表2逐字一致; 无可枚举L3, 见 theme_contexts.jsonl)
    provenance: official_curriculum
    curriculum_ref: "普通高中英语课程标准(2017年版2020修订) §主题语境"
    applies_to: [阅读理解, 完形填空, "完形填空(七选五/语篇)", 语法填空, 读后续写]
    hierarchy:
      人与自我:
        - 生活与学习
        - 做人与做事
      人与社会:
        - 社会服务与人际沟通
        - "文学、艺术与体育"
        - "历史、社会与文化"
        - 科学与技术
      人与自然:
        - 自然生态
        - 环境保护
        - 灾害防范
        - 宇宙探索

  # 维度 2: 设问类型 (阅读理解理解性技能 — 教育部考试中心《中国高考评价体系》7项, 3独立官方源印证)
  question_intent:
    desc: 阅读理解理解性技能 (官方 L1 7项; 项目原5类降为教辅别名 L2)
    provenance: official_neea
    curriculum_ref: >-
      陈康、吴泓霖、李新煜、乔辉《基于高考评价体系的英语科考试内容改革实施路径》,
      《中国考试》2019年第12期(作者单位=教育部考试中心); 权威转述(命题团队自身解读文章,
      非《中国高考评价体系》白皮书原文电子版本身, 2026-07-06 WebFetch原始网页逐字核对+
      对抗核查独立复核一致, 见 docs/RESUME.md)
    applies_to: [阅读理解]
    labels:  # L1 官方7项 (🟢)
      - {id: 理解词汇, prov: official_neea}
      - {id: 理解具体信息, prov: official_neea}
      - {id: 理解主旨要义, prov: official_neea}
      - {id: 理解观点态度, prov: official_neea}
      - {id: 理解目的, prov: official_neea, note: "项目原5类漏此项, 官方明列且趋势上升"}
      - {id: 推断, prov: official_neea}
      - {id: 理解文章结构类型, prov: official_neea, note: "项目原5类漏此项"}
    aliases:  # 项目原5类(教辅通用名 🟡 convention) → 官方L1, 不单独入canonical
      细节理解: 理解具体信息
      主旨大意: 理解主旨要义
      态度观点: 理解观点态度
      词义猜测: 理解词汇
      推理判断: 推断
    analysis_label_aliases:  # 教研解析显式题型名(带"题"后缀; 2015-2020旧课标解析用词) → 官方L1 7技能
      # cognitive_skill.py 抽取读此 (G4 去硬编码: _SKILL_MAP 收口单点)。
      # 仅映射**明确同义**; 模糊题型(细节推理/代词指代/词义指代)诚实不列 → _skill_of 返 None skip。
      # 坑16: dual-model 一致≠对, 不臆测; target 必 ∈ 上方 labels 官方7项 (d0 check 锁一致)。
      推理判断题: 推断
      细节理解题: 理解具体信息
      主旨大意题: 理解主旨要义
      词义猜测题: 理解词汇
      词句猜测题: 理解词汇
      词义推测题: 理解词汇        # = 词义猜测题 (同义变体, 2015-2020 教研解析用词)
      标题概括题: 理解主旨要义    # = 主旨/标题族 (同义)
      标题大意题: 理解主旨要义
      标题判断题: 理解主旨要义    # judge best title = 理解主旨
      # 2026-07-06 补(方法论调研+对抗核查, 首次填充"理解目的"这个此前0数据覆盖的官方桶):
      # 两条raw文本均明确问"作者写作目的/意图"(非"推断题"字面), 官方7项把"理解目的"与"推断"
      # 列为并列独立条目(非"推断"子类), 故不并入推断桶。均只1条真实样本, 诚实标注不夸大置信度。
      写作意图题: 理解目的        # legacy 2017 q27 "可见本文作者写作的目的就是为了纪念一位朋友"
      目的意图题: 理解目的        # subq 2024 EN-XGKII-2024-078 "作者写这篇文章的目的是推荐一本..."

  # 维度 3: 体裁 (课标官方文体 + 命题实证子类)
  genre:
    desc: 语篇文体 (课标官方文体 🟢 + 命题实证细分 🟡)
    provenance: official_curriculum
    curriculum_ref: "普通高中英语课程标准 §语篇类型"
    applies_to: [阅读理解, 完形填空, "完形填空(七选五/语篇)", 语法填空, 读后续写, 应用文写作]
    labels:
      - {id: 记叙文, prov: official_curriculum}
      - {id: 说明文, prov: official_curriculum}
      - {id: 议论文, prov: official_curriculum}
      - {id: 应用文, prov: official_curriculum}
      - {id: 新闻报道, prov: official_curriculum}
      - {id: 书评介绍, prov: empirical_liaoning, note: "命题实证细分, 非课标明列"}

  # 维度 4: 文本连续性 (课标正交维度, 项目此前未建; 待落)
  text_continuity:
    desc: 连续性文本 vs 非连续性文本 (课标官方正交维度)
    provenance: official_curriculum
    curriculum_ref: "普通高中英语课程标准 §语篇类型(连续/非连续)"
    status: pending  # 暂未标注, 列出以备件2后续
    labels:
      - {id: 连续性文本, prov: official_curriculum}
      - {id: 非连续性文本, prov: official_curriculum, note: "图表/广告/活动单/目录等"}

  # 维度 5: 语法考点 (语法填空/完形 — 映射课标 106 项官方语法; 9类粒度是高频面归纳 🟡)
  grammar_point:
    desc: 语法填空/完形挖空考查的语法点 (映射课标 grammar_items 106 项; 9类粒度=高考高频面归纳)
    provenance: empirical_liaoning
    curriculum_ref: "可映射 grammar_items.jsonl(课标106项); 9类聚合为高频考查面"
    applies_to: [语法填空, 完形填空]
    labels:
      - {id: 动词时态语态, prov: empirical_liaoning}
      - {id: 非谓语动词, prov: empirical_liaoning}
      - {id: 定语从句, prov: empirical_liaoning}
      - {id: 名词性从句, prov: empirical_liaoning}
      - {id: 状语从句, prov: empirical_liaoning}
      - {id: 连词介词, prov: empirical_liaoning}
      - {id: 冠词代词, prov: empirical_liaoning}
      - {id: 构词派生, prov: empirical_liaoning}
      - {id: 形容词副词比较, prov: empirical_liaoning}

# 落库契约:
sink:
  node_type: exam_point
  node_id_pattern: "exam_point:{dimension}:{label_id}"   # L2 用 "exam_point:theme_context:历史、社会与文化"
  edge_relation: tests_exam_point
  evidence_fields: [provenance, confidence, cue_matched, curriculum_ref]
  provenance_levels: [official_curriculum, official_neea, empirical_liaoning, convention]  # 分层不混, 趋势按层加权
