# 考点 canonical 分类体系 (件2 地基) — 数据化判断规则 (§3.5 不 hardcode)
#
# 这是"辽宁高考英语考什么"的受控词表 (controlled vocabulary): 四个维度的合法 label 全集。
# 任何真题考点标注 (人工/双模型) 只能从这里取 label, 不许自创; 标注落 nodes(node_type=exam_point)
# + edges(relation=tests_exam_point), evidence_json 带 provenance + confidence。
#
# 来源 (可溯源, 非臆造):
#   - 设问类型 / 体裁 / 语法考点: docs/exam_scenario_patterns.md 实证规律 (188 辽宁真题)
#   - 题材语境: 课标主题语境 data/structured/curriculum/theme_contexts.jsonl + docs/exam_topic_landscape.md
#   - 语法考点大类: 官方课标语法体系 (data 已入库 grammar 106 项, 此处取高考高频考查面)
#
# provenance 红线 (C 级可信度, CLAUDE.md §3.2): LLM 单模型拆的标注必标 llm_single, 不冒充核验;
# 双模型一致才 dual_model_agree; 教师核验才 human_verified。趋势/分布按 provenance 分层, 不混。

version: 1
status: draft  # 件2 标注落库前为 draft; 标注+审计闭环后转 active

dimensions:

  # 维度 1: 设问类型 (阅读理解 — 一道小题考查的能力)
  question_intent:
    desc: 阅读理解小题的设问意图 (从设问句判断)
    applies_to: [阅读理解]
    labels:
      - {id: 主旨大意, desc: 主旨/标题/段落大意/写作目的, cue: "main idea / title / purpose / mainly about"}
      - {id: 细节理解, desc: 事实细节定位, cue: "according to / what / when / where / which"}
      - {id: 推理判断, desc: 隐含信息/作者暗示/推断, cue: "infer / imply / suggest / learn from"}
      - {id: 词义猜测, desc: 划线词/短语/指代义猜测, cue: "underlined word / refers to / means"}
      - {id: 态度观点, desc: 作者/人物态度倾向, cue: "attitude / tone / think of"}

  # 维度 2: 体裁 (语篇类型)
  genre:
    desc: 语篇文体类型
    applies_to: [阅读理解, 完形填空, "完形填空(七选五/语篇)", 语法填空, 读后续写, 应用文写作]
    labels:
      - {id: 记叙文, desc: 故事/人物经历/第一人称叙事}
      - {id: 说明文, desc: 客观说明事物/现象/科普}
      - {id: 议论文, desc: 观点论证/评论}
      - {id: 应用文, desc: 活动通知/景区导览/书信/邮件/须知}
      - {id: 新闻报道, desc: 时事/事件报道体}
      - {id: 书评介绍, desc: 书/画册/作品介绍}

  # 维度 3: 语法考点 (语法填空 / 完形 — 一空考查的语法面)
  grammar_point:
    desc: 语法填空/完形挖空考查的语法点 (从答案+解析判断)
    applies_to: [语法填空, 完形填空]
    labels:
      - {id: 动词时态语态, desc: 时态/语态/主谓一致}
      - {id: 非谓语动词, desc: 不定式/动名词/分词}
      - {id: 定语从句, desc: 关系代词/关系副词}
      - {id: 名词性从句, desc: 主/宾/表/同位语从句}
      - {id: 状语从句, desc: 时间/条件/原因/让步等}
      - {id: 连词介词, desc: 并列/从属连词 + 介词}
      - {id: 冠词代词, desc: 冠词/代词}
      - {id: 构词派生, desc: 词性转换/派生 (形容词↔副词↔名词)}
      - {id: 形容词副词比较, desc: 比较级/最高级}

  # 维度 4: 题材语境 (课标主题语境 — 语篇话题归属)
  theme_context:
    desc: 课标三大主题语境 (骨架取自 theme_contexts.jsonl, 不自创)
    applies_to: [阅读理解, 完形填空, "完形填空(七选五/语篇)", 语法填空, 读后续写]
    labels:
      - {id: 人与自我, desc: 生活学习/兴趣爱好/自我认知/职业体验}
      - {id: 人与社会, desc: 社会服务人际/历史社会文化/科技信息/文学艺术体育}
      - {id: 人与自然, desc: 自然生态/环境保护/灾害防范/宇宙探索}

# 标注落库契约 (件2 实现时遵守):
sink:
  node_type: exam_point          # nodes.node_type
  node_id_pattern: "exam_point:{dimension}:{label_id}"   # concept_id
  edge_relation: tests_exam_point # edges.relation (question:X → exam_point:Y)
  evidence_fields: [provenance, confidence, cue_matched]  # edges.evidence_json
  provenance_levels: [human_verified, dual_model_agree, llm_single]  # 分层, 不混算趋势
