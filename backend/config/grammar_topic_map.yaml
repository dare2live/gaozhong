# 教材单元语法主题 → 课标官方 grammar_item 映射 (§3.5 判断数据化, 非估算).
#
# 来源: 教材 Grammar-kind section 标题/正文首行陈述的语法主题 (真相源=教材自身),
#       人教版"Grammar 语法"附录有中英双语标签, 外研版"Using language"英文主题。
# 目标: grammar_items (106项, 全来自课标 PDF 4.普通高中英语课程标准2017版2020修订)。
# 映射依据: 标准语法术语等价 (Modals=情态动词, attributive clause=定语从句...), 非估算/非主观。
# 用法: grammar_occurrence 提取器对每段语法主题文本按 patterns 顺序首匹配 (specific 在前),
#       命中→该 grammar_item_id 入 grammar_occurrences; 不命中→诚实跳过 (歧义交际指令不强配, D0 返空>假推)。
# 有序: 列表顺序即匹配优先级 (具体 -ing/-ed/不定式 在 非谓语 umbrella 之前)。

rules:
  - patterns: ["basic sentence structure", "基本句型"]
    grammar_item_id: "三/4"
    note: 基本句型
  - patterns: ["modal", "情态动词"]
    grammar_item_id: "一/2/(5)"
    note: 情态动词
  - patterns: ["subject-verb agreement", "主谓一致"]
    grammar_item_id: "三/8"
    note: 主谓一致
  # 坑29 (2026-07-04) 追加: 具体时态+被动组合须排在"passive voice"/"tense" 两个 umbrella 之前
  # (有序匹配, 具体优先; 否则 "Present perfect passive" 会被泛 umbrella 提前吃掉)。
  - patterns: ["present perfect passive", "现在完成时的被动语态"]
    grammar_item_id: "三/6/(5)"
    note: 现在完成时的被动语态
  - patterns: ["present continuous passive", "现在进行时的被动语态"]
    grammar_item_id: "三/6/(4)"
    note: 现在进行时的被动语态
  - patterns: ["past perfect passive", "过去完成时的被动语态"]
    grammar_item_id: "三/6/(7)"
    note: 过去完成时的被动语态
  - patterns: ["past continuous passive", "过去进行时的被动语态"]
    grammar_item_id: "三/6/(6)"
    note: 过去进行时的被动语态
  - patterns: ["passive voice", "被动语态"]
    grammar_item_id: "三/6"
    note: 被动语态 (umbrella)
  - patterns: ["present perfect continuous", "现在完成进行"]
    grammar_item_id: "三/5/(10)"
    note: 现在完成进行
  - patterns: ["past future", "过去将来"]
    grammar_item_id: "三/5/(7)"
    note: 过去将来
  - patterns: ["future continuous", "将来进行"]
    grammar_item_id: "三/5/(8)"
    note: 将来进行
  - patterns: ["past perfect", "过去完成"]
    grammar_item_id: "三/5/(9)"
    note: 过去完成
  - patterns: ["-ing as attributive", "-ing as subject", "-ing form", "-ing 形式", "ing 形式"]
    grammar_item_id: "三/7/(2)"
    note: 动词的-ing形式
  - patterns: ["-ed as adverbial", "-ed as attributive", "past participle", "-ed form", "-ed 形式", "ed 形式", "过去分词"]
    grammar_item_id: "三/7/(3)"
    note: 动词的-ed形式
  - patterns: ["infinitive", "动词不定式"]
    grammar_item_id: "三/7/(1)"
    note: 动词不定式
  - patterns: ["non-finite", "非谓语"]
    grammar_item_id: "三/7"
    note: 动词的非谓语形式 (umbrella)
  - patterns: ["restrictive relative", "限制性定语从句"]
    grammar_item_id: "三/10/(3)/a"
    note: 限制性定语从句
  - patterns: ["non-restrictive relative", "非限制性定语从句"]
    grammar_item_id: "三/10/(3)/b"
    note: 非限制性定语从句
  - patterns: ["attributive clause", "relative clause", "relative pronoun", "定语从句"]
    grammar_item_id: "三/10/(3)"
    note: 定语从句 (umbrella)
  - patterns: ["adverbial clause", "状语从句"]
    grammar_item_id: "三/10/(2)"
    note: 状语从句
  - patterns: ["subject clause", "主语从句"]
    grammar_item_id: "三/10/(4)"
    note: 主语从句
  - patterns: ["predicative clause", "表语从句"]
    grammar_item_id: "三/10/(5)"
    note: 表语从句
  - patterns: ["noun clause", "名词性从句"]
    grammar_item_id: "三/10/(1)"
    note: 名词性从句 (取代表项宾语从句; 复习课覆盖主/宾/表/同位语从句)
  - patterns: ["ellipsis", "省略句", "省略"]
    grammar_item_id: "三/11"
    note: 省略
  - patterns: ["tag question", "反义疑问句", "附加疑问句"]
    grammar_item_id: "三/1/(2)/d"
    note: 附加疑问句
  - patterns: ["tense", "时态"]
    grammar_item_id: "三/5"
    note: 谓语动词的时态 (umbrella)
