# 端点 HTTP 契约 (数据化真相源; 审计 MAJOR: 端点无契约断言 → 本文件收口)
#
# 消费者: scripts/lib/endpoint_contract_check.py — in-process 直调 ALL_ROUTES[path](params),
# 不起 http server。断言: 不抛异常 / 顶层类型匹配 / required_keys 全在 / 无 error 键 (除非 allow_error)。
# 覆盖率自检: ALL_ROUTES 出现新端点而本文件未写契约 → checker 红 (防"未断言维度永远绿")。
#
# 字段:
#   params:        最小合法 query (parse_qs 形态 {k: [v]}, 值全是字符串; 与 main.py do_GET 一致)
#   type:          dict | list — 顶层返回类型
#   required_keys: dict 型响应必须含的 2-4 个语义关键键 (抽样语义键, 非全部键; list 型不填)
#   allow_error:   true — 该调用允许返回 error 键 (仅两类: POST-body 端点的 GET 探测 / 已知数据缺口)
#   note:          人读说明 (checker 不消费)
#
# 固定 id 参数说明 (来自稳定种子数据, init_db 重建后不变):
#   t-li / sy-2024-001    域B 多租户种子 (teachers/classes/students)
#   unit:waiyan/bixiu_1/*  KG unit 节点 (外研必修一; 沈阳主用版本)
#   qb_id=1 / course id=1  题库与 40 节课程模板的最小 id
