# 真相源版本注册表种子 (PIT §3.1; 灌入 source_versions 表; docs/kg_layer_design.md §3.1)
#
# 每条 = 一个真相源版本 + 生效年区间. 判断数据化 (改区间改 yaml 不动代码).
# 锚点 (effective_version 调用方按 kind 选, 必修a): exam_paper 按真题年(exam_year);
#   textbook/curriculum/course 按考生入学年(enroll_year/cohort) — 真题年 ≠ 考生用的教材年.
# 不变量 (D0 门锁): 每 (kind, variant) 内 — 区间不重叠 + 相邻行 to+1==下一行 from (无空洞, 末行 to=null).
# 只落已真实存在(已入仓)的版本, 不预填空版本; 换版时 append 新行不删旧行.
