# 卷面结构真相源 — 辽宁卷各卷制 era 的题型构成 (数据化, CLAUDE §3.5; presence 掩码读它, 单一真相)
#
# 用途: 题型 presence 命题趋势的"提取完整性掩码"。区分两类"题型不在数据里":
#   (a) 真退场/真登场 (结构性: 卷面改了) — 命题趋势真值, 可断言。
#   (b) 缺源/提取不全 (卷面有该题型, 但本项目未结构化抽全) — 诚实标 unknown, 不冒充"消失/登场年"。
#
# 真相源 = 真题原卷结构 (结构性真值, 非命题内容; ≥2 源: 教育部新高考改革文件 + 历年真题卷结构):
#   - 旧课标全国II (2015-2020): 听力 + 阅读(含七选五) + 完形 + 语法填空 + 短文改错 + 书面表达(作文)
#   - 新高考全国II (2021+):     听力 + 阅读(含七选五) + 完形 + 语法填空 + 应用文写作 + 读后续写  (取消短文改错+作文, 新增应用文+读后续写)
# canonical = 该卷制结构性包含的题型 (data question_type 命名); extraction_gap = 卷面有但本项目提取不全 (presence 年不可作首末考年信号)。

eras:
  "2015-2020_旧课标II":
    canonical:
      - 阅读理解
      - 完形填空(七选五/语篇)      # 阅读第二节 七选五
      - 完形填空
      - 语法填空
      - 短文改错                    # 旧课标有 → 新高考取消 (真退场锚)
      - 听力                        # 卷面有, 本项目未抽全
      - 书面表达                    # 旧课标作文 → 新高考改应用文+续写 (真退场锚); 本项目未独立抽
    extraction_gap:
      - 听力
      - 书面表达
  "2021+_新高考II":
    canonical:
      - 阅读理解
      - 完形填空(七选五/语篇)
      - 完形填空
      - 语法填空
      - 续写                        # 读后续写 = 新高考新增 (真登场锚)
      - 应用文写作                  # 应用文 = 新高考新增 (真登场锚)
      - 听力                        # 卷面常驻, 本项目未抽全
    extraction_gap:
      - 听力                        # known_gaps: 2021/2022 listening 未抽全 (exam_paper_contracts.yaml)
      - 续写                        # 2023(gzenxx)+2024/2025 已入题干; 2021/2022 仍缺 → 登场年不可信
      - 应用文写作                  # 同上

    # 笔试部分 canonical 题数 (新高考II 标准卷面结构, ≥2源: 教育部新高考改革文件 + 历年真题卷; 听力20题/笔试外不计)。
    # 用途(后端审计 根因B): 蓝图组卷 type_mix 用此**真考纲结构**, 取代 grain混合 avg_share(2021/22子题级 vs
    # 2023-26篇章级混算致阅读占比虚高)。docstring 一直承诺"退回考纲蓝图固定结构", 此处兑现为数据化真值。
    item_counts:
      阅读理解: 15                  # 4 篇 × 约 3-4 小题
      "完形填空(七选五/语篇)": 5    # 阅读第二节 七选五
      完形填空: 15
      语法填空: 10
      续写: 1
      应用文写作: 1
