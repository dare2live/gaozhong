# 内容门注册表 (值==第一手源, 非计数自洽; 判断数据化 §3.5).
#
# 根治"绿门验计数/结构不验内容"(自洽棘轮): 旧门只断言 COUNT==N / 无悬挂端点, 内容偏离躺库内仍绿。
# 本表每条 = 一个**内容门**: 一句 SQL 现算"DB 内容 vs 第一手源/真值规则"的偏离数, 期望 0(或阈)。
#
# **可扩展**: 加内容门 = 加一行(query+op+expect+source), **不写代码**。ContentGateChecker 单引擎统跑。
# **可复用/工具化**: 同一注册表被 D0 门(run_truth_checks 经 CHECKERS)+ CLI(scripts/tools/truth_check)+
#   moth(可镜像) 共用 = 单一真相, 不再"D0 AND moth 各写一遍"(坑17 重复)。
# **PDF 抽取类内容门**(需读第一手 PDF 现抽对比, 如标题==PDF)走专用 TruthChecker(unit_title_fix 等),
#   不在本 SQL 注册表; 本表只收**纯 SQL 可表达**的内容门。
#
# op: eq(==) / ge(>=) / le(<=)。query 必须 SELECT 出单个数值。

gates:
  - id: in_curriculum_truth
    domain: vocab
    source: "cefr_vocab (课标PDF词表)"
    desc: "unit_vocab_intro.in_curriculum==词∈cefr_vocab 真值(非硬编码True谎报越纲, 违§1.2)"
    query: "SELECT COUNT(*) FROM unit_vocab_intro u WHERE u.in_curriculum <> EXISTS(SELECT 1 FROM cefr_vocab c WHERE LOWER(c.word)=LOWER(u.word))"
    op: eq
    expect: 0

  # 注: glosses_have_chinese 由 GlossaryTruthChecker 拥有(与PUA同checker); no_theme_l3 由 ThemeTruthChecker
  #     拥有 — 单一 owner 不重复。本注册表只收**无专用checker的纯SQL内容门**。

  - id: dict_no_llm_overwrite
    domain: glossary
    source: "真值源(教材/中考/COCA/variant), 非LLM"
    desc: "交付级词典义项 gloss_source 无 cleaned_judged(双模型consolidate零血缘不可复核, 违红线义项来自真值源)"
    query: "SELECT COUNT(*) FROM exam_vocabulary WHERE gloss_source IN ('cleaned_judged')"
    op: eq
    expect: 0

  - id: coca_no_proper_noun
    domain: glossary
    source: "COCA_with_translation.txt (专名行不入考试词典)"
    desc: "COCA源释义无专名(人名/地名音译)尾段; exam_dictionary._strip_coca_pn 段级去专名(84→0)"
    query: "SELECT COUNT(*) FROM exam_vocabulary WHERE gloss_source='COCA' AND (gloss LIKE '%人名%' OR gloss LIKE '%地名%')"
    op: eq
    expect: 0

  - id: cefr_level_from_stars
    domain: vocab
    source: "课标PDF附录2星标(* 必修 / ** 选必 / 义教无星)"
    desc: "cefr_level 必由 raw_suffix 星数现算(防带括注行 ** 脱token致父词+alt全标义教, 44行错已修)"
    query: "SELECT COUNT(*) FROM cefr_vocab WHERE cefr_level <> CASE WHEN raw_suffix LIKE '%***%' THEN '选修' WHEN raw_suffix LIKE '%**%' THEN '选必' WHEN raw_suffix LIKE '%*%' THEN '必修' ELSE '义教' END"
    op: eq
    expect: 0

  - id: grammar_no_truncation
    domain: grammar
    source: "课标PDF附录3语法项 (label==PDF原文, 无折行截断)"
    desc: "grammar_items label 括号配平(折行续写已合并; seq91/92/100/101 截断已补全)"
    query: "SELECT COUNT(*) FROM grammar_items WHERE (LENGTH(label)-LENGTH(REPLACE(label,'（',''))) <> (LENGTH(label)-LENGTH(REPLACE(label,'）','')))"
    op: eq
    expect: 0

  - id: renjiao_phrase_present
    domain: vocab
    source: "data/textbooks/renjiao/*.pdf 各单元生词段(无IPA短语词条)"
    desc: "人教短语词条召回(clean up/look forward to等无IPA短语, 旧版被当续行吸进前词丢失231条; _PHRASE_HEAD_RE识别)"
    query: "SELECT COUNT(*) FROM unit_vocab_intro WHERE version_key='renjiao' AND word IN ('clean up','look forward to','focus on','be responsible for','at last','credit card')"
    op: ge
    expect: 6

  - id: exam_dictionary_gloss_no_bleed
    domain: vocab
    source: "exam_vocabulary.gloss (交付词典 + 练习题释义源, A2/A7)"
    desc: "考试词典释义无邻栏bleed(页眉/课标说明吸入): exam_vocabulary.gloss 是 dict前端 + exercise quiz 共用释义源(A2修后poc读它非unit_vocab.zh_def), 须0 bleed标记防练习题/词典乱码回归"
    query: "SELECT COUNT(*) FROM exam_vocabulary WHERE gloss LIKE '%sions in Each Unit%' OR gloss LIKE '%课标词；专有名词%' OR gloss LIKE '%在每单元词表后面单独列出%'"
    op: eq
    expect: 0

  - id: renjiao_variant_words_present
    domain: vocab
    source: "data/textbooks/renjiao/*.pdf (英美变体拼写头词 'organise (NAmE -ize) /IPA/')"
    desc: "人教变体拼写头词召回(A4: organise/recognise等英美变体词, 原_ENTRY_HEAD_RE不识词与IPA间(NAmE -ize)→失配吸进前词丢失; 修后≥5个独立入表)"
    query: "SELECT COUNT(*) FROM unit_vocab_intro WHERE version_key='renjiao' AND word IN ('organise','recognise','civilisation','criticise','analyse')"
    op: ge
    expect: 5

  # 注: zh_def 短语污染门暂不加 — 残留污染(（-起首短语如'senior high school'/缩写/表头噪声 吸进前词zh_def)
  #     与合法英文(语法注'also forwards'/'pl. stadia')无法用单一正则干净区分(106混合命中)。
  #     主短语召回已由 renjiao_phrase_present 锁; 残留污染留后续 parsing 精化(（-起首短语头 + 表头过滤)。

  - id: question_type_era_structural_truth
    domain: exam
    source: "真题原卷题型 (exam_questions.question_type, structural_truth)"
    desc: "命题趋势真值层(题型presence): 短文改错仅旧课标era(2021退场)/续写仅新高考era(2024登场)/阅读两era皆在(骨架)。锁结构事实防漂移"
    query: "SELECT (CASE WHEN EXISTS(SELECT 1 FROM exam_questions WHERE province LIKE '辽宁%' AND question_type='短文改错' AND year>=2021) THEN 1 ELSE 0 END) + (CASE WHEN EXISTS(SELECT 1 FROM exam_questions WHERE province LIKE '辽宁%' AND question_type='续写' AND year<2021) THEN 1 ELSE 0 END) + (CASE WHEN NOT EXISTS(SELECT 1 FROM exam_questions WHERE province LIKE '辽宁%' AND question_type='阅读理解' AND year<2021) THEN 1 ELSE 0 END) + (CASE WHEN NOT EXISTS(SELECT 1 FROM exam_questions WHERE province LIKE '辽宁%' AND question_type='阅读理解' AND year>=2021) THEN 1 ELSE 0 END)"
    op: eq
    expect: 0

  - id: cognitive_skill_era_shift_truth
    domain: exam
    source: "教研解析显式题型 (cognitive_skill edges, 高考四选一口径)"
    desc: "命题哲学迁移真值: 四选一推断占比 新高考II>旧课标II (不含七选五结构空/中考; 坑16)"
    query: >-
      SELECT CASE WHEN (
        (SELECT COUNT(*) FROM edges WHERE relation='tests_exam_point'
          AND dst_id='exam_point:cognitive_skill:推断'
          AND COALESCE(json_extract_string(evidence_json,'$.exam_stage'),'gaokao')='gaokao'
          AND json_extract_string(evidence_json,'$.provenance')<>'curriculum_aligned_task'
          AND CAST(json_extract_string(evidence_json,'$.lineage.source_year') AS INT)>=2021)
        *
        (SELECT COUNT(*) FROM edges WHERE relation='tests_exam_point'
          AND json_extract_string(evidence_json,'$.dimension')='cognitive_skill'
          AND COALESCE(json_extract_string(evidence_json,'$.exam_stage'),'gaokao')='gaokao'
          AND json_extract_string(evidence_json,'$.provenance')<>'curriculum_aligned_task'
          AND CAST(json_extract_string(evidence_json,'$.lineage.source_year') AS INT) BETWEEN 2015 AND 2020)
      ) > (
        (SELECT COUNT(*) FROM edges WHERE relation='tests_exam_point'
          AND dst_id='exam_point:cognitive_skill:推断'
          AND COALESCE(json_extract_string(evidence_json,'$.exam_stage'),'gaokao')='gaokao'
          AND json_extract_string(evidence_json,'$.provenance')<>'curriculum_aligned_task'
          AND CAST(json_extract_string(evidence_json,'$.lineage.source_year') AS INT) BETWEEN 2015 AND 2020)
        *
        (SELECT COUNT(*) FROM edges WHERE relation='tests_exam_point'
          AND json_extract_string(evidence_json,'$.dimension')='cognitive_skill'
          AND COALESCE(json_extract_string(evidence_json,'$.exam_stage'),'gaokao')='gaokao'
          AND json_extract_string(evidence_json,'$.provenance')<>'curriculum_aligned_task'
          AND CAST(json_extract_string(evidence_json,'$.lineage.source_year') AS INT)>=2021)
      ) THEN 0 ELSE 1 END
    op: eq
    expect: 0

  - id: weakness_recommend_bridge
    domain: student
    source: "图谱主题桥 (theme_aligns→theme_of_unit)"
    desc: "学情闭环非by-construction-0: 弱点考点经主题桥可达course≥1(旧 cm.ref_id=concept_id 直配永远0命中已修)"
    query: "SELECT COUNT(*) FROM (SELECT DISTINCT c.course_id FROM nodes ep JOIN edges ta ON ta.src_id=ep.concept_id AND ta.relation='theme_aligns' JOIN edges tu ON tu.dst_id=ta.dst_id AND tu.relation='theme_of_unit' JOIN course_materials cm ON cm.ref_id=tu.src_id JOIN courses c ON c.course_id=cm.course_id WHERE ep.concept_id LIKE 'exam_point:theme_l2:%')"
    op: ge
    expect: 1
