# 命题近年加权 — 操作型单点真相源 (去硬编码 backlog G1)
#
# 宪法铁律 P1 §1.2 (backend/services/constitution.py:33-35 散文条款):
#   "2025(权重5)>2024(4)>2023(3)>2022(2)>2021(1.5)>旧(0.5). 趋势/频次/模板全部加权."
# 近年真题权重递增: 趋势/频次/模板分析全部按此加权 (近年命题信号 > 历史存量)。
