#   保留独立字面量做 yaml↔宪法对账, 见该文件注释)。
weights:
  2025: 5
  2024: 4
  2023: 3
  2022: 2
  2021: 1.5
# 未列年份 (2021 前旧课标自主命题期) 兜底权重
default: 0.5
