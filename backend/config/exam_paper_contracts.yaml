          - reading
          - language_use
          - writing
        current_known_sources:
          - eol_xgkii_english_2022
        current_status: raw_partial_and_structured_draft_not_import_ready
        known_gaps:
          - EOL source appears written-paper-only; listening 1-20 not observed.
      2023:
        expected_min_rows: 55
        expected_sections:
          - listening
          - reading
          - language_use
          - writing
        current_known_sources:
