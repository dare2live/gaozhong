          - legacy_local_pdf_xgkii_english_2024
        current_status: imported_canonical_passage_level_not_item_level
        known_gaps:
          - Project-local verified structured seed only covers 6 rows for 2024; it cannot close full item-level M0 coverage.
          - Current local PDF importer produced 9 passage-level rows, not full item-level rows.
      2025:
        expected_min_rows: 55
