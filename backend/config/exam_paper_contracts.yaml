# Exam paper coverage contracts.
#
# Purpose:
# - Define what "complete" means before parser/import code runs.
# - Keep target scope out of importer code.
# - Preserve D0 rule: unknown or partial sources must not be normalized into success.

contracts:
  xgkii_english_m0_2021_2025:
    subject: English
    paper_type: 新高考全国II卷
    paper_type_aliases:
      - 新高考全国II卷
      - 新课标 II 卷
      - 新课标II卷
    project_focus: 辽宁新高考英语教学与命题模型
    status: active_m0_truth_baseline
    truth_gate: scripts/tools/audit/truth_baseline_audit.py --strict
    source_state_required_for_import: import_ready
    source_state_required_for_completion: d0_verified
    notes:
      - 2021 and 2022 are the current known M0 weak years.
      - Historical GAOKAO-Bench rows can seed trend and question-bank views, but they are not enough to prove item-level New Curriculum II truth coverage.
      - Listening and written-paper sources may need separate provenance, but the contract must make that split explicit before completion.
    years:
      2021:
        expected_min_rows: 55
        expected_sections:
          - listening
          - reading
          - language_use
          - writing
        current_known_sources:
          - eol_xgkii_english_2021
        current_status: structured_draft_not_import_ready
        known_gaps:
          - EOL listening rows are currently unkeyed.
          - Previous Sunedu New Gaokao I listening candidate is quarantined and must not close the New Curriculum II contract without an explicit shared-listening proof.
          - Sunedu listening source is labelled New Gaokao I and must not be treated as II without shared-source evidence.
      2022:
        expected_min_rows: 55
        expected_sections:
