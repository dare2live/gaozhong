          - EOL landing page and third-party PDF are acquired and sha256 locked, but still require content-level cross-check before item-level D0 proof.
          - Imported GAOKAO-Bench rows are not item-level full-paper proof.
          - Project-local verified structured seed only covers 6 rows for 2023; it cannot close full item-level M0 coverage.
      2024:
        expected_min_rows: 55
        expected_sections:
