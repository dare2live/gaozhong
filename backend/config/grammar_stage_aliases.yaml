# 初中↔高中 语法 label 跨阶段别名 (deepens 边 K12 衔接; 审计 HIGH#7)
#
# 问题: 初中课标 与 高中课标 对同一语法点用不同措辞/颗粒度, label 精确匹配漏掉 12 个最核心的
#       时态/非谓语/定语从句深化边 (K12 衔接拱心石)。
# 解法: 显式人工核验的别名 (初中 label → 高中 label), 不用模糊匹配 (防 一般现在时→一般现在时的被动语态 误连)。
# 核验: 每对都是同一语法概念, 初中学基础→高中深化 (加被动/更多功能/限制性)。改这里不动代码 (§3.5)。
#
# 格式: <初中 label>: <高中 label>  (两侧必须是 nodes 表里真实存在的 label)
#
# 坑(2026-07-04): 最后一条"关系从句"key 曾是跨页截断的半句(旧 PDF 续行合并缺陷遗留), 该缺陷修复后
# 初中侧 label 变全, 此处 key 未同步更新致 deepens 边缺 1 条(D0 71/71→69/71 才发现)。改初中侧
# label 文本(junior_high_curriculum.py 的 marker/续写正则)时, 必须同步 grep 本文件确认无 key 失配。
aliases:
  "简单句的基本句型": "基本句型"
  "主谓（主语+动词，下同）（SV）": "主谓（主语 + 谓词，下同） （SV）"
  "一般现在时": "一般现在"
  "一般过去时": "一般过去"
  "一般将来时": "一般将来"
  "现在进行时": "现在进行"
  "过去进行时": "过去进行"
  "现在完成时": "现在完成"
  "动词不定式（作宾语、宾语补足语、目的状语）": "动词不定式（作宾语、补语、目的状语、定语*、结果状语 *、主语 **、表语 **）"
  "动词的-ing形式": "动词的 -ing 形式（作定语 *、状语 *、补语 *、主语 **、宾语 **、表语 **）"
  "动词的-ed形式": "动词的 -ed 形式（作定语 *、状语 *、补语 *、表语 **）"
  '关系从句（亦称"定语从句"，能辨认出由关系代词 that、which、who 引导的限定性定语从句，并能理解句意）': "定语从句"
