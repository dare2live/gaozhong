      - {id: dialog_01, from: data/external/exam_sources/listening_candidates/2022_xgki_ii_kekenet_long_1.mp3}
      - {id: dialog_02, from: data/external/exam_sources/listening_candidates/2022_xgki_ii_kekenet_long_2.mp3}
      - {id: dialog_03, from: data/external/exam_sources/listening_candidates/2022_xgki_ii_kekenet_long_3.mp3}
      - {id: dialog_04, from: data/external/exam_sources/listening_candidates/2022_xgki_ii_kekenet_long_4.mp3}
      - {id: passage_01, from: data/external/exam_sources/listening_candidates/2022_xgki_ii_kekenet_monologue.mp3}
  2023:
