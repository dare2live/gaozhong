# 音频资源配置 — Phase 7.2 听力播放器壳 (非可教听力模块)
# 命名规范: data/audio/{year}/listening/{id}.mp3
# id 格式: {section}_{question_number}  (eg: short_01, dialog_05, passage_01)
#
# 高考英语听力结构 (新课标 II 卷):
#   Section A: 5 短对话 (各 1 题, 5 分)
#   Section B: 4 长对话/独白 (各 2-3 题, 15 分)
#   Section C: 1 填空题 (5 空, 10 分) — 2021 起部分年份调整
#   满分 30 分, 占总分 150 的 20%
#
# 诚实状态 (2026-07-15 全局审计):
#   - 卷面听力 = skeleton + extraction_gap (trend/raw)
#   - DB 辽宁听力题: 2021=20, 2026=1 group, 2022–25=0
#   - data/audio/{year}/ 目录占位存在, mp3 文件数 = 0 → 不作「可教听力模块」
#   - years_with_audio 必须反映真实文件, 禁止把卷面年份冒充已覆盖

version: "1.1"
updated: "2026-07-15"
module_status: extraction_gap_not_teachable
module_note: >-
  听力是卷面骨架题型, 本项目未抽全且无音频文件。UI/产品不得标「听力模块已上线」。
  播放器组件(common.js audioPlayer)仅作壳; 无 src 时显式「无音频」。

directory_layout:
  root: "data/audio"
  pattern: "{year}/listening/{id}.mp3"
  example: "2024/listening/short_01.mp3"

sections:
  short_dialog:
    prefix: "short"
    description: "Section A 短对话 — 5 段, 每段 1 题"
    count: 5
    questions_per: 1
    points_per: 1
    total_points: 5

  long_dialog:
    prefix: "dialog"
    description: "Section B 长对话 — 2 段, 每段 3-4 题"
    count: 2
    questions_per: 3
    points_per: 1.5
    total_points: 9

  monologue:
    prefix: "passage"
    description: "Section B 独白 — 2 段, 每段 3-4 题"
    count: 2
    questions_per: 3
    points_per: 1.5
    total_points: 9

  dictation:
    prefix: "dict"
    description: "Section C 听力填空 (部分年份)"
    count: 1
    questions_per: 5
    points_per: 1.4
    total_points: 7

scoring:
  total_points: 30
  total_weight_percent: 20
  play_count: 2

tts_fallback:
  enabled: false
  engine: "macos_say"
  voice: "Samantha"
  rate: 160
  note: "禁用 TTS 冒充真听力; 有官方/授权音频再开"

# 有 mp3 的年份才写入; 当前正式目录 data/audio 仍 0 —
# 候选在 listening_candidates/ (见 acquisition_listening_audio_web.md), 未交叉核验不升档。
years_with_audio: []
# 卷面应有听力的年份 (结构真值, 非本库提取完成)
paper_years_listening_expected: [2021, 2022, 2023, 2024, 2025, 2026]
# 开放直链已镜像的候选年 (≠ teachable)
candidate_audio_years_mirrored: [2021, 2022, 2023, 2024, 2025, 2026]
candidate_audio_gaps: []
# 文字稿候选目录 (≠ 入 DB 真值)
transcript_dir: data/external/exam_sources/listening_transcripts
transcript_years_mirrored: [2021, 2025, 2026]  # 2022-24: 音频有、公开页文字稿需人工/可可见面另存
