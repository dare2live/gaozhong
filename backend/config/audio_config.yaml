# 音频资源配置 — 听力播放 (第三方指纹核验可教档)
# 命名规范: data/audio/{year}/listening/{id}.mp3
#
# 诚实分层 (2026-07-15 业主拍板升档):
#   - years_with_audio = 正式目录确有 mp3 的年份 (禁止空目录冒充)
#   - provenance = third_party_not_neea (133ku/kekenet/newdu; 非考试院官方发行口)
#   - fingerprint = ASR 锚点 PASS (listening_audio_transcript_fingerprint.json)
#   - 题库 has_audio 行另计; 音频文件在 ≠ 每题已挂题干

version: "1.2"
updated: "2026-07-15"
module_status: third_party_fingerprint_verified
module_note: >-
  2021–2026 听力音频已升入 data/audio/{year}/listening/，ASR 指纹与仓内文字稿一致。
  源为第三方镜像(非 NEEA/省考试院官方发布口)。UI 可播放，须标明第三方核验来源。
  禁止 TTS 冒充真听力。

provenance:
  class: third_party_not_neea
  fingerprint_report: data/structured/exam_point/listening_audio_transcript_fingerprint.json
  fingerprint_verdict: PASS
  years_fingerprinted: [2021, 2022, 2023, 2024, 2025, 2026]

directory_layout:
  root: "data/audio"
  pattern: "{year}/listening/{id}.mp3"
  example: "2024/listening/dialog_01.mp3"

sections:
  short_dialog:
    prefix: "short"
    description: "Section A 短对话 — 5 段, 每段 1 题"
    count: 5
    questions_per: 1
    points_per: 1
    total_points: 5

  long_dialog:
    prefix: "dialog"
    description: "Section B 长对话 — 通常 4 段 (本仓按源打包: dialog_01..04 或 full)"
    count: 4
    questions_per: 3
    points_per: 1.5
    total_points: 12

  monologue:
    prefix: "passage"
    description: "Section B 独白 — 通常 1 段"
    count: 1
    questions_per: 4
    points_per: 1.5
    total_points: 6

  dictation:
    prefix: "dict"
    description: "Section C 听力填空 (部分年份; 本仓暂无独立分段)"
    count: 0
    questions_per: 5
    points_per: 1.4
    total_points: 0

scoring:
  total_points: 30
  total_weight_percent: 20
  play_count: 2

tts_fallback:
  enabled: false
  engine: "macos_say"
  voice: "Samantha"
  rate: 160
  note: "禁用 TTS 冒充真听力"

# 正式目录有文件的年份 (promote 脚本写入后须与磁盘一致)
years_with_audio: [2021, 2022, 2023, 2024, 2025, 2026]
paper_years_listening_expected: [2021, 2022, 2023, 2024, 2025, 2026]
candidate_audio_years_mirrored: [2021, 2022, 2023, 2024, 2025, 2026]
candidate_audio_gaps: []

transcript_dir: data/external/exam_sources/listening_transcripts
transcript_years_mirrored: [2021, 2022, 2023, 2024, 2025, 2026]

# promote 清单: candidate → data/audio/{year}/listening/{id}.mp3
promote_map:
  2021:
    source: 133ku
    packing: full_paper
    files:
      - {id: full, from: data/external/exam_sources/listening_candidates/2021_xgkii_listening_133ku_candidate.mp3}
  2022:
    source: kekenet
    packing: section_bundles
    files:
