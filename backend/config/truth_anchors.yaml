# 真值锚注册表 (truth_anchors) — 模块化真值校验系统的"标准即数据"层.
#
# 根治: 三门一直验"自洽"(计数==快照)不验"真值"(内容匹配第一手源) → 自洽棘轮 → 污染长期绿门.
# 本表每条 = 一个真值锚: 第一手源 + 内容指纹(markers, 钉死) + lifecycle + provenance.
# 门验"库内容 ∩ 真值锚 markers", 不是"计数==182". 标准文档: docs/truth_anchor_protocol.md.
#
# lifecycle: active(强制, 内容不匹配→BLOCK) / no_anchor(无第一手源→UNKNOWN, 不冒充已验证, 用户立法3).
# 冲突仲裁: 第一手胜 (verified_mirror/官方PDF > 库内自标 > 派生快照).
# 加新锚: 改本 yaml(judgment 数据化 §3.5); 加新比对方式: backend/services/truth_baseline 注册一个 checker.
exam:
  provenance_note: |
    ⚠️ 2026-06-20 重大纠偏: mirror(gaokao_xgkii_2021_2025_mirror.jsonl)被证实**自身误标** —
    其 2021 内容(Take a view/rhino)实为**全国甲卷**, 非辽宁新高考II卷。真正的 2021 新高考II卷 =
    eol 内容(Harrogate/Zafirakou/虎崽/牲畜机器人), 经 eol metadata(自称新课标II卷) + 独立web
    (cpsenglish.com 2021新高考全国卷II 列出 4 篇阅读)双源确认。教训: 锚的真值性必须 ≥2 独立源,
    不能默认任一"基线"是真值(mirror 之前被当真值基线, 实际错的; cognitive_skill 用了 mirror 待复核)。
  anchors:
    "2021:辽宁:gaokao":
      year: 2021
      province: 辽宁
      lifecycle: active
      provenance: "independent_verified(eol_metadata新课标II卷 + cpsenglish web确认)"
      markers: ["Harrogate", "Zafirakou", "Spot"]   # 真2021新高考II卷篇章(eol+web双源); eol库内容含→PASS(eol正确, 非污染)
    "2022:辽宁:gaokao":
      year: 2022
      province: 辽宁
      lifecycle: no_anchor          # 待独立源验证(mirror 不可信, 不再用作锚源)
      provenance: none
    "2023:辽宁:gaokao":
      year: 2023
      province: 辽宁
      lifecycle: no_anchor          # 原 mirror 锚作废(mirror 已证不可信); 待 ≥2 独立源重建
      provenance: none
    "2024:辽宁:gaokao":
      year: 2024
      province: 辽宁
      lifecycle: no_anchor          # 同上, mirror 锚作废待重建
      provenance: none
    "2025:辽宁:gaokao":
      year: 2025
      province: 辽宁
      lifecycle: no_anchor
      provenance: none
