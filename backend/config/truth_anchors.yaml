# 真值锚注册表 (truth_anchors) — 模块化真值校验系统的"标准即数据"层.
#
# 根治: 三门一直验"自洽"(计数==快照)不验"真值"(内容匹配第一手源) → 自洽棘轮 → 污染长期绿门.
# 本表每条 = 一个真值锚: 第一手源 + 内容指纹(markers, 钉死) + lifecycle + provenance.
# 门验"库内容 ∩ 真值锚 markers", 不是"计数==182". 标准文档: docs/truth_anchor_protocol.md.
#
# lifecycle: active(强制, 内容不匹配→BLOCK) / no_anchor(无第一手源→UNKNOWN, 不冒充已验证, 用户立法3).
# 冲突仲裁: 第一手胜 (verified_mirror/官方PDF > 库内自标 > 派生快照).
# 加新锚: 改本 yaml(judgment 数据化 §3.5); 加新比对方式: backend/services/truth_baseline 注册一个 checker.
exam:
  provenance_note: |
    ⚠️ 2026-06-20 重大纠偏: mirror(gaokao_xgkii_2021_2025_mirror.jsonl)被证实**自身误标** —
    其 2021 内容(Take a view/rhino)实为**全国甲卷**, 非辽宁新高考II卷。真正的 2021 新高考II卷 =
    eol 内容(Harrogate/Zafirakou/虎崽/牲畜机器人), 经 eol metadata(自称新课标II卷) + 独立web
    (cpsenglish.com 2021新高考全国卷II 列出 4 篇阅读)双源确认。教训: 锚的真值性必须 ≥2 独立源,
    不能默认任一"基线"是真值(mirror 之前被当真值基线, 实际错的; cognitive_skill 用了 mirror 待复核)。
  # 全 5 年 markers 经 ≥2 独立源逐年核验 (DB真题/eol metadata/已验证mirror/独立web), 见 docs/truth_anchor_protocol §6.
  # 结论: DB 辽宁高考真题(182行)全是真辽宁新高考II卷 — 审计"省份污染红线"是假警报(根源 mirror 2021 单条误标甲卷)。
  anchors:
    "2021:辽宁:gaokao":
      year: 2021
      province: 辽宁
      lifecycle: active
      provenance: "≥2源(eol_metadata新课标II卷 + cpsenglish web)"
      markers: ["Harrogate", "Zafirakou", "Spot"]        # 真2021II卷(eol库内容含→PASS)
    "2022:辽宁:gaokao":
      year: 2022
      province: 辽宁
      lifecycle: active
      provenance: "≥2源(eol_metadata + web: Textalyzer在2022新高考II卷C段)"
      markers: ["Textalyzer", "Levine"]
    "2023:辽宁:gaokao":
      year: 2023
      province: 辽宁
      lifecycle: active
      provenance: "≥3源(DB GAOKAO-Bench + mirror + web: Yellowstone/Artist Point在2023新课标II卷)"
      markers: ["Yellowstone", "Artist Point"]
    "2024:辽宁:gaokao":
      year: 2024
      province: 辽宁
      lifecycle: active
      provenance: "≥3源(DB local_pdf + mirror + web: Trost/Shakespeare在2024新课标II卷)"
      markers: ["Trost", "Shakespeare"]
    "2025:辽宁:gaokao":
      year: 2025
      province: 辽宁
      lifecycle: active
      provenance: "≥2源(DB local_pdf + web: Shrewsbury/Detrinidad在2025全国II卷)"
      markers: ["Shrewsbury", "Detrinidad"]
