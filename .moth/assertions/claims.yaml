kind: assertion_pack
name: gaozhong-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-15 创立
# 规则: 任何带数字/状态的关键真相 (本 session 数据诚实性整改成果), 在这里挂一条可执行断言;
# 真相变化时同 commit 更新断言 — 弹仓漂移(红) = 回退/腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。DB 需先 init_db 建好。
assertions:
  # ===== 真题 provenance 诚实性 (L-N/L-P/L-R) =====
  - id: nonII-not-faking-liaoning
    claim: "非新课标II卷(I/III/甲/乙)不冒充辽宁 (category-aware; 辽宁只用新课标II; L-N/L-P/L-R)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE province LIKE '辽宁%' AND paper_type IN ('新课标 I 卷','新课标 III 卷','全国甲卷','全国乙卷')"
    expect: {op: "==", value: 0}
  - id: liaoning-is-xgkii
    claim: "辽宁卷 paper_type 必为新课标II卷 (辽宁 2015 起只用新课标II)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE province LIKE '辽宁%' AND paper_type <> '新课标 II 卷'"
    expect: {op: "==", value: 0}
  - id: pre2015-not-liaoning
    claim: "2010-2014 辽宁自主命题期不冒充辽宁 (gb 数据为他省新课标II)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE year <= 2014 AND province LIKE '辽宁%'"
    expect: {op: "==", value: 0}
  - id: smoking-gun-gone
    claim: "全国甲卷 'Landscape Photographer' 行不再标辽宁 (L-P smoking gun; 已随 GAOKAO 占位删除)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE raw_question LIKE '%Landscape%Photographer%' AND province LIKE '辽宁%'"
    expect: {op: "==", value: 0}
  - id: eol-truth-imported
    claim: "EOL 真题 2021/2022 辽宁新高考全国II卷已入库 110 题 (M0 真值补全, 替换 GAOKAO 占位)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo LIKE 'eol_xgkii%'"
    expect: {op: "==", value: 110}
  - id: eol-no-hard-truncation
    claim: "EOL raw_question 无 900 硬截断 (#8: snippet 去 compact 900 限, 阅读篇章全保留; len==900=smoking gun)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo LIKE 'eol_xgkii%' AND LENGTH(raw_question)=900"
    expect: {op: "==", value: 0}
  - id: local-pdf-no-watermark
    claim: "local_pdf raw_question 无页中水印bleed (坑18续: 锦宏/学科网 mock-PDF 每页页脚公众号/客服/页码 mid-passage注入污染题干; _strip_watermark 按行剥, 正文0丢失)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo='local_pdf' AND (raw_question LIKE '%锦宏教育%' OR raw_question LIKE '%学科 网（北 京）%')"
    expect: {op: "==", value: 0}
  - id: local-pdf-reproducible
    claim: "2024/2025 真题 PDF 18 题入库 (M6: init_db Layer 4g 改 in-process import_pdfs(con) 后可复现; 防 subprocess 第二写连接锁冲突回归 → local_pdf=0)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo = 'local_pdf'"
    expect: {op: "==", value: 18}

  # ===== init_db 全量重建鲁棒性 (M6: git 非 ASCII 路径 + file_manifest) =====
  - id: manifest-nonascii-ok
    claim: "中文名文件正确入 file_manifest (M6: load.py 用 git ls-files -z; 防 quotepath 八进制引号致 init_db 崩回归)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM file_manifest WHERE rel_path LIKE '%上海市初中%'"
    expect: {op: "==", value: 1}

  # ===== 学情派生诚实性 (无假推) =====
  - id: weakness-derived-no-orphan
    claim: "student_weakness 全有 student_answers 在该真考点上的错题支撑 (2026-06-16改: 弱点维度=exam_point真考点非word token; 0 orphan)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM student_weakness w WHERE NOT EXISTS (SELECT 1 FROM student_answers sa JOIN question_bank qb ON qb.qb_id=sa.question_id::BIGINT JOIN edges e ON e.src_id=('question:'||qb.origin_ref) AND e.relation='tests_exam_point' WHERE sa.student_id=w.student_id AND e.dst_id=w.concept_id)"
    expect: {op: "==", value: 0}
  - id: weakness-is-exam-point
    claim: "学情薄弱环节维度=exam_point真考点(非word token假象; critic#2修复, 错题→真考点→薄弱)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM student_weakness WHERE concept_id NOT LIKE 'exam_point:%'"
    expect: {op: "==", value: 0}

  # ===== Phase 7 生成层回滚 (仅真题, 无生成范文) =====
  - id: qbank-real-only
    claim: "question_bank 仅真题, 无合成/生成练习 (Phase 7 回滚; 回退=生成层复活)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM question_bank WHERE origin <> 'real'"
    expect: {op: "==", value: 0}
  - id: course-handouts-empty
    claim: "course_handouts 空 (讲义生成范文已回滚; 教材基石完善前不重建)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM course_handouts"
    expect: {op: "==", value: 0}
  - id: enriched-content-deleted
    claim: "backend/config/enriched_content/ 生成讲义 yaml 已删 (Phase 7 回滚)"
    type: shell
    command: ["bash", "-c", "ls backend/config/enriched_content/*.yaml 2>/dev/null | wc -l | tr -d ' '"]
    expect: {op: "==", value: "0"}

  # ===== 停用词污染清洗 (L-U) =====
  - id: no-stopword-tags
    claim: "question_tags 无功能词 tag (the/it/to/they; L-U 停用词清洗)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM question_tags WHERE tag_id IN ('word:the','word:it','word:to','word:they','word:of','word:a','word:is','word:and')"
    expect: {op: "==", value: 0}
  - id: stopwords-config-present
    claim: "停用词表数据化在 config/stopwords.yaml (§3.5 规则不 hardcode)"
    type: shell
    command: ["grep", "-c", "english_stopwords", "backend/config/stopwords.yaml"]
    expect: {op: ">=", value: 1}
  - id: year-weights-matches-constitution
    claim: "year_weights.yaml 操作型权重 == 宪法铁律P1字面 {2025:5..2021:1.5} (G1 去硬编码: 5副本收口单点; verify-the-verifier 坑1+接孤儿门进门2 坑21)"
    type: shell
    command: ["python3", "-c", "from scripts.tools.audit.model_capability_audit import _check_weight_compliance as c; print(len(c()['mismatches']))"]
    expect: {op: "==", value: "0"}
  - id: skill-map-yaml-single-point
    claim: "cognitive_skill _SKILL_MAP 收口 exam_point_taxonomy.yaml 单点 (G4); 题型→技能 ≥9条 + target ⊆ 官方7理解性技能 (坑16 防非官方漂移; 独立官方7字面量校验)"
    type: shell
    command: ["python3", "-c", "from backend.services.exam_point.cognitive_skill import _load_skill_map as f; m=f(); off={'推断','理解具体信息','理解主旨要义','理解词汇','理解观点态度','理解目的','理解文章结构类型'}; print(0 if (len(m)>=9 and set(m.values())<=off) else 1)"]
    expect: {op: "==", value: "0"}
  - id: gaokao-structure-yaml-single-point
    claim: "高考卷面结构收口 question_types.yaml 单点 (G6); 6计分题型总分150, weight派生score/总分现算 (exam_alignment_checker GAOKAO_STRUCTURE 不再硬编码)"
    type: shell
    command: ["python3", "-c", "from scripts.tools.alignment.exam_alignment_checker import GAOKAO_STRUCTURE as G; print(0 if (len(G)==6 and sum(v['score'] for v in G.values())==150) else 1)"]
    expect: {op: "==", value: "0"}
  - id: liaoning-label-single-point
    claim: "辽宁卷 province 标签收口 scope 单点 (G3); 5消费者(exam_paper/exam_province/eol_import/pdf/truth_baseline_load)全解析到同一 scope.LIAONING_XGKII_2021 (坑3/坑7 防散落漂移)"
    type: shell
    command: ["python3", "-c", "from backend.services.trend import scope; from backend.services.data_sources.clean.exam_paper import LN_II_2021; from backend.services.extraction.exam_province import LABEL_XGKII_LN; from backend.services.imports.eol_import import PROVINCE; print(0 if (LN_II_2021==LABEL_XGKII_LN==PROVINCE==scope.LIAONING_XGKII_2021=='辽宁 (新课标 II 卷, 2021+)') else 1)"]
    expect: {op: "==", value: "0"}
  - id: paper-type-single-point
    claim: "exam_questions.paper_type canonical值 '新课标 II 卷' 收口 scope.PAPER_XGKII 单点 (穷尽扫描: ≥5 writer 各自硬编码 → 收口); D0门字面独立保留(verify-the-verifier)"
    type: shell
    command: ["python3", "-c", "from backend.services.trend import scope; from backend.services.imports.eol_import import PAPER_TYPE; from backend.services.extraction.exam_province import PAPER_XGKII; print(0 if (PAPER_TYPE==PAPER_XGKII==scope.PAPER_XGKII=='新课标 II 卷') else 1)"]
    expect: {op: "==", value: "0"}
  - id: publisher-version-map-single-point
    claim: "出版社/版本短名映射收口 canonical 单点 (穷尽扫描: canonical/links pub_short_map 字节级副本 + links/recommend version 双向 → 收口); links/recommend import canonical 共用"
    type: shell
    command: ["python3", "-c", "import inspect; from backend.services import canonical, links, recommend; ok=(canonical.pub_to_short('外语教学与研究出版社')=='外研版' and canonical.VERSION_KEY_TO_SHORT.get('renjiao')=='人教版' and 'canonical.pub_to_short' in inspect.getsource(links.build_allowed_in_ln) and 'canonical.VERSION_KEY_TO_SHORT' in inspect.getsource(recommend)); print(0 if ok else 1)"]
    expect: {op: "==", value: "0"}
  - id: dim-label-single-point
    claim: "exam_point 维度→课标标签收口 category-config.js GZ_CAT.dim 单点 (穷尽扫描: beike/teacher/jiangke 5处散落 + theme_context已漂移 → 收口归一); teacher.html 已加载 category-config.js"
    type: shell
    command: ["bash", "-c", "grep -q 'dim:' frontend/static/category-config.js && grep -q 'theme_context: \"主题语境\"' frontend/static/category-config.js && grep -q 'category-config.js' frontend/teacher.html && grep -q 'GZ_CAT.dim' frontend/static/beike.js && echo 0 || echo 1"]
    expect: {op: "==", value: "0"}
  - id: stage-label-single-point
    claim: "cefr_level→stage 展示标签收口 stage_labels.CEFR_LEVEL_STAGE 单点 (穷尽扫描: exam_dictionary/exam_coverage 各写一份); exam_coverage 本地扩展校本扩展/课标变形"
    type: shell
    command: ["python3", "-c", "from backend.services.stage_labels import CEFR_LEVEL_STAGE as S; from backend.services.exam_dictionary import _LEVEL_STAGE; from backend.services.audit.exam_coverage import _STAGE; print(0 if (S=={'义教':'义务教育','必修':'高中必修','选必':'高中选修'} and _LEVEL_STAGE is S and _STAGE.get('校本扩展')=='校本超纲' and _STAGE.get('义教')=='义务教育') else 1)"]
    expect: {op: "==", value: "0"}
  - id: orphan-thresholds-wired
    claim: "thresholds.yaml 孤儿key(vocab容差/question_bank难度/extraction字符边界/text ngram)已接活消费 (坑21: 声明却零消费→接线); get_threshold 抽中立 leaf backend/services/thresholds.py (避层级倒置)"
    type: shell
    command: ["python3", "-c", "import inspect; from backend.services import thresholds; from backend.services.audit import curriculum; from backend.services.question_bank import loader as ql; from backend.services.course import scenarios; from backend.services.exercise import cloze; ok=(thresholds.get_threshold('extraction.section_text_max_chars')==5000 and thresholds.get_threshold('vocab.level_tolerance')==100 and 'get_threshold' in inspect.getsource(curriculum._level_sev) and 'difficulty_char_threshold' in inspect.getsource(ql._difficulty) and 'section_text_max_chars' in inspect.getsource(cloze) and scenarios.NGRAM_N==10); print(0 if ok else 1)"]
    expect: {op: "==", value: "0"}
  - id: cog-newera-honest-downgrade
    claim: "D区设问技能新era不可信(n=15<30)视觉降级(教研室#11 死线3诚实分层): beike 读 distribution_reliable, false时灰降级+'⚠样本不足'banner+叙事'方向性参考(非趋势结论)'(critic谄媚死flag修; C区结构presence的'万变不离其宗'是合法structural_truth不在此列)"
    type: shell
    command: ["bash", "-c", "grep -q 'distribution_reliable' frontend/static/beike.js && grep -q '方向性参考' frontend/static/beike.js && grep -q '样本不足' frontend/static/beike.js && echo 0 || echo 1"]
    expect: {op: "==", value: "0"}
  - id: compose-in-spa
    claim: "自定义组卷进主SPA(教研室#6 全量收敛): app_router genCompose 调 /api/paper/compose + 默认type_mix从库内真类型(去legacy不存在的'选义单选') + stem放宽; 收敛自 /teacher#compose"
    type: shell
    command: ["bash", "-c", "grep -q 'genCompose' frontend/static/app_router.js && grep -q 'paper/compose' frontend/static/app_router.js && ! grep -q '选义单选' frontend/static/app_router.js && echo 0 || echo 1"]
    expect: {op: "==", value: "0"}
  - id: lesson-tab-offline-service-kept
    claim: "北极星PhaseA: 单元备课(lesson)等教师工具前端下线(app.html 不加载 lesson.js + nav-config 无'单元备课') 但后端服务保留(/api/lesson_plan 路由 + lesson_plan 服务在; 'A 教师工具下线但后端保留')"
    type: shell
    command: ["bash", "-c", "! grep -q 'lesson.js' frontend/app.html && ! grep -q '单元备课' frontend/static/nav-config.js && test -f backend/api/routes/lesson_plan.py && echo 0 || echo 1"]
    expect: {op: "==", value: "0"}
  - id: blueprint-practice-wired
    claim: "蓝图练习卷接矿口(教研室#12): qbank tab 调 /api/exercise/blueprint_practice 渲 paper + 诚实标 composition_basis(结构对齐非预测非押题); 原0前端消费空转修复"
    type: shell
    command: ["bash", "-c", "grep -q 'blueprint_practice' frontend/static/app_router.js && grep -q 'composition_basis\\|非预测' frontend/static/app_router.js && echo 0 || echo 1"]
    expect: {op: "==", value: "0"}
  - id: export-print-wired
    claim: "导出/打印能力在位(教研室#5): common.js 导出 exportChartPNG/exportCSV 共享helper + beike图卡⬇PNG/打印本页 + dict⬇CSV 消费; 研判产物可带进教研会/打印"
    type: shell
    command: ["bash", "-c", "grep -q 'exportChartPNG' frontend/static/common.js && grep -q 'exportCSV' frontend/static/common.js && grep -q 'wireExports' frontend/static/beike.js && grep -q 'GZ.exportCSV\\|G.exportCSV' frontend/static/dict.js && echo 0 || echo 1"]
    expect: {op: "==", value: "0"}
  - id: exam-point-popup-entry-wired
    claim: "考点浮窗入口在位(教研室#3): graph_popup 导出 GZ.openPopup; 共现图 click→popup 收口在 common.js renderCooccurNetwork 单点(铁律1, 图表标签非HTML无法走click委托故需图内绑定); jiangke C' + 图谱tab 均复用该单点渲染器; beike A区 click 调 G.openPopup"
    type: shell
    command: ["bash", "-c", "grep -q 'GZ.openPopup = openPopup' frontend/static/graph_popup.js && grep -q 'window.GZ.openPopup' frontend/static/common.js && grep -q 'G.openPopup' frontend/static/beike.js && grep -q 'renderCooccurNetwork' frontend/static/jiangke.js && grep -q 'renderCooccurNetwork' frontend/static/app_router.js && echo 0 || echo 1"]
    expect: {op: "==", value: "0"}
  - id: exam-point-popup-not-empty
    claim: "exam_point 浮窗真题不断链(教研室#2): genre考点显qbank真题 + cognitive_skill考点显2021+子题 + word回归; 防 relation IN 漏 tests_exam_point 再断链"
    type: shell
    command: ["python3", "-c", "import duckdb; from backend.api.routes.graph_popup import _fetch_questions as f; c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True); print(0 if (len(f(c,'exam_point:genre:记叙文'))>0 and len(f(c,'exam_point:cognitive_skill:推断'))>0 and len(f(c,'word:make'))>0) else 1)"]
    expect: {op: "==", value: "0"}
  - id: vocab-slope-single-point
    claim: "词汇量slope显著阈收口 scope.VOCAB_SLOPE_SIGNIFICANT 单点 (P2); model._slope_interp + predicted 难度判定共读, 不再各自硬编码50 (防两处漂移)"
    type: shell
    command: ["python3", "-c", "import inspect; from backend.services.trend import scope, model as m; import backend.services.exercise.predicted as p; ok=(scope.VOCAB_SLOPE_SIGNIFICANT==50 and 'VOCAB_SLOPE_SIGNIFICANT' in inspect.getsource(m._slope_interp) and 'VOCAB_SLOPE_SIGNIFICANT' in inspect.getsource(p._spec_from_trends)); print(0 if ok else 1)"]
    expect: {op: "==", value: "0"}

  # ===== 分析诚实 (件1: D0 从"数据诚实"扩展到"分析诚实") =====
  - id: trend-province-scoped
    claim: "命题趋势默认锚定辽宁卷 + 样本量护栏 (件1; 防混284全国卷/薄样本伪装趋势回归)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services import trend;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);r=trend.question_type_year_trend(c)[0];print('OK' if r.get('province_scope')=='辽宁卷' and 'reliable' in r else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}
  - id: trend-summary-anchored
    claim: "trend_summary 锚定辽宁卷 + 带样本量诊断 (前端首页趋势不混全国卷)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services import trend;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);s=trend.trend_summary(c);print('OK' if s.get('province_scope')=='辽宁卷' and 'sample_diagnosis' in s else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}
  - id: practice-not-prediction
    claim: "练习卷不冒充'预测/押题': 趋势不可信(辽宁样本不足)时退回**考纲蓝图固定结构**(后端审计B2: exam_structure_eras.item_counts 真考纲题数, 取代原 grain混合 avg_share), 不按 slope 加权 (REVISE predicted.py)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services.exercise.predicted import generate_blueprint_practice_paper as g;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);p=g(c,total=10);b=p['composition_basis']['selection_basis'];print('OK' if 'blueprint_canonical' in b and 'slope' not in b and p['paper_type']=='blueprint_structured_practice' else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}

  # ===== 词×真题考过状态 单一计算点 (#12/#13/#14: exam_vocab 唯一 tokenizer + exam_coverage 唯一 writer) =====
  - id: exam-status-province-scoped
    claim: "词 exam_status 辽宁口径 (§7, #13): 无 core/HV_extra 节点而辽宁命中(gaokao_hit_count_ln)=0 — 不混外省冒充辽宁考过"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM nodes WHERE node_type='word' AND json_extract_string(attrs_json,'exam_status') IN ('core','HV_extra') AND COALESCE(TRY_CAST(json_extract_string(attrs_json,'gaokao_hit_count_ln') AS BIGINT),0)=0"
    expect: {op: "==", value: 0}
  - id: exam-status-3source-consistent
    claim: "3源一致 (#12): node HV_extra 数 == vocab_classification.jsonl『真超纲·辽宁考过』数 (单一计算点收敛, 三处不再各算矛盾)"
    type: shell
