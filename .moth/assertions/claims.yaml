kind: assertion_pack
name: gaozhong-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-15 创立
# 规则: 任何带数字/状态的关键真相 (本 session 数据诚实性整改成果), 在这里挂一条可执行断言;
# 真相变化时同 commit 更新断言 — 弹仓漂移(红) = 回退/腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。DB 需先 init_db 建好。
assertions:
  # ===== 真题 provenance 诚实性 (L-N/L-P/L-R) =====
  - id: nonII-not-faking-liaoning
    claim: "非新课标II卷(I/III/甲/乙)不冒充辽宁 (category-aware; 辽宁只用新课标II; L-N/L-P/L-R)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE province LIKE '辽宁%' AND paper_type IN ('新课标 I 卷','新课标 III 卷','全国甲卷','全国乙卷')"
    expect: {op: "==", value: 0}
  - id: liaoning-is-xgkii
    claim: "辽宁卷 paper_type 必为新课标II卷 (辽宁 2015 起只用新课标II)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE province LIKE '辽宁%' AND paper_type <> '新课标 II 卷'"
    expect: {op: "==", value: 0}
  - id: pre2015-not-liaoning
    claim: "2010-2014 辽宁自主命题期不冒充辽宁 (gb 数据为他省新课标II)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE year <= 2014 AND province LIKE '辽宁%'"
    expect: {op: "==", value: 0}
  - id: smoking-gun-gone
    claim: "全国甲卷 'Landscape Photographer' 行不再标辽宁 (L-P smoking gun; 已随 GAOKAO 占位删除)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE raw_question LIKE '%Landscape%Photographer%' AND province LIKE '辽宁%'"
    expect: {op: "==", value: 0}
  - id: eol-truth-imported
    claim: "EOL 真题 2021/2022 辽宁新高考全国II卷已入库 110 题 (M0 真值补全, 替换 GAOKAO 占位)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo LIKE 'eol_xgkii%'"
    expect: {op: "==", value: 110}
  - id: local-pdf-reproducible
    claim: "2024/2025 真题 PDF 18 题入库 (M6: init_db Layer 4g 改 in-process import_pdfs(con) 后可复现; 防 subprocess 第二写连接锁冲突回归 → local_pdf=0)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo = 'local_pdf'"
    expect: {op: "==", value: 18}

  # ===== init_db 全量重建鲁棒性 (M6: git 非 ASCII 路径 + file_manifest) =====
  - id: manifest-nonascii-ok
    claim: "中文名文件正确入 file_manifest (M6: load.py 用 git ls-files -z; 防 quotepath 八进制引号致 init_db 崩回归)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM file_manifest WHERE rel_path LIKE '%上海市初中%'"
    expect: {op: "==", value: 1}

  # ===== 学情派生诚实性 (无假推) =====
  - id: weakness-derived-no-orphan
    claim: "student_weakness 全有 student_answers 在该真考点上的错题支撑 (2026-06-16改: 弱点维度=exam_point真考点非word token; 0 orphan)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM student_weakness w WHERE NOT EXISTS (SELECT 1 FROM student_answers sa JOIN question_bank qb ON qb.qb_id=sa.question_id::BIGINT JOIN edges e ON e.src_id=('question:'||qb.origin_ref) AND e.relation='tests_exam_point' WHERE sa.student_id=w.student_id AND e.dst_id=w.concept_id)"
    expect: {op: "==", value: 0}
  - id: weakness-is-exam-point
    claim: "学情薄弱环节维度=exam_point真考点(非word token假象; critic#2修复, 错题→真考点→薄弱)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM student_weakness WHERE concept_id NOT LIKE 'exam_point:%'"
    expect: {op: "==", value: 0}

  # ===== Phase 7 生成层回滚 (仅真题, 无生成范文) =====
  - id: qbank-real-only
    claim: "question_bank 仅真题, 无合成/生成练习 (Phase 7 回滚; 回退=生成层复活)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM question_bank WHERE origin <> 'real'"
    expect: {op: "==", value: 0}
  - id: course-handouts-empty
    claim: "course_handouts 空 (讲义生成范文已回滚; 教材基石完善前不重建)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM course_handouts"
    expect: {op: "==", value: 0}
  - id: enriched-content-deleted
    claim: "backend/config/enriched_content/ 生成讲义 yaml 已删 (Phase 7 回滚)"
    type: shell
    command: ["bash", "-c", "ls backend/config/enriched_content/*.yaml 2>/dev/null | wc -l | tr -d ' '"]
    expect: {op: "==", value: "0"}

  # ===== 停用词污染清洗 (L-U) =====
  - id: no-stopword-tags
    claim: "question_tags 无功能词 tag (the/it/to/they; L-U 停用词清洗)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM question_tags WHERE tag_id IN ('word:the','word:it','word:to','word:they','word:of','word:a','word:is','word:and')"
    expect: {op: "==", value: 0}
  - id: stopwords-config-present
    claim: "停用词表数据化在 config/stopwords.yaml (§3.5 规则不 hardcode)"
    type: shell
    command: ["grep", "-c", "english_stopwords", "backend/config/stopwords.yaml"]
    expect: {op: ">=", value: 1}

  # ===== 分析诚实 (件1: D0 从"数据诚实"扩展到"分析诚实") =====
  - id: trend-province-scoped
    claim: "命题趋势默认锚定辽宁卷 + 样本量护栏 (件1; 防混284全国卷/薄样本伪装趋势回归)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services import trend;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);r=trend.question_type_year_trend(c)[0];print('OK' if r.get('province_scope')=='辽宁卷' and 'reliable' in r else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}
  - id: trend-summary-anchored
    claim: "trend_summary 锚定辽宁卷 + 带样本量诊断 (前端首页趋势不混全国卷)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services import trend;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);s=trend.trend_summary(c);print('OK' if s.get('province_scope')=='辽宁卷' and 'sample_diagnosis' in s else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}
  - id: practice-not-prediction
    claim: "练习卷不冒充'预测/押题': 趋势不可信(辽宁样本不足)时退回蓝图固定占比, 不按 slope 加权 (REVISE predicted.py)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services.exercise.predicted import generate_blueprint_practice_paper as g;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);p=g(c,total=10);b=p['composition_basis']['selection_basis'];print('OK' if 'blueprint_fixed' in b and p['paper_type']=='blueprint_structured_practice' else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}

  # ===== 考点 canonical 维度 (件2 拱心石: 取代 word-token 冒充考点) =====
  - id: exam-point-edges-present
    claim: "考点 canonical 维度已落库: tests_exam_point 边 ≥300 (188辽宁题 genre/theme 双模型标注)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM edges WHERE relation = 'tests_exam_point'"
    expect: {op: ">=", value: 300}
  - id: exam-point-dual-model-only
    claim: "考点边只入 dual_model_agree (歧义 needs_review 不入 canonical; provenance 诚实, 不冒充人工核验)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM edges WHERE relation = 'tests_exam_point' AND json_extract_string(evidence_json, '$.provenance') <> 'dual_model_agree'"
    expect: {op: "==", value: 0}
  - id: exam-point-no-orphan-edge
    claim: "考点边 src 必为真实 question 节点 (无悬挂; Rule 3 edges 一等公民)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM edges e WHERE e.relation='tests_exam_point' AND NOT EXISTS (SELECT 1 FROM nodes n WHERE n.concept_id=e.src_id AND n.node_type='question')"
    expect: {op: "==", value: 0}
  - id: exam-point-theme-l2-official
    claim: "theme 已细化到课标官方10主题群(L2)落库 (taxonomy v2; 回应'太粗', ≥100条 theme_l2 边)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM edges WHERE relation='tests_exam_point' AND json_extract_string(evidence_json,'$.dimension')='theme_l2'"
    expect: {op: ">=", value: 100}

  # ===== 工程纪律 (Rule 8) =====
  - id: no-god-module
    claim: "无 >400 行 god-module (Rule 8; 2026-06-15 拆 4 个治理 god-module 后 huge=0)"
    type: shell
    command: ["bash", "-c", "find backend scripts -name '*.py' -not -path '*__pycache__*' | xargs wc -l 2>/dev/null | awk '$2!=\"total\" && $1>400' | wc -l | tr -d ' '"]
    expect: {op: "==", value: "0"}

  # ===== 教材基石完整性 (防"零单元"陈旧说法复发) =====
  - id: textbook-units-extracted
    claim: "教材 78 单元全已抽 (2026-06-16 补 renjiao/bixiu_2 UNIT5 MUSIC, regex 漏抓→override优先 77→78)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM units"
    expect: {op: ">=", value: 78}
  - id: unit-vocab-no-orphan
    claim: "unit_vocab_intro 每词条必有 units PK 行 (Canonical First; 坑: bixiu_2 漏抽U5致9词悬挂, 已修)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM unit_vocab_intro v WHERE NOT EXISTS (SELECT 1 FROM units u WHERE u.version_key=v.version_key AND u.volume_key=v.volume_key AND u.unit_number=v.unit_number)"
    expect: {op: "==", value: 0}
  - id: textbook-sections-have-text
    claim: "216 sections 全有 raw_text 正文 (n_chars>50; 2026-06-16 补10 waiyan单元 150→216)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM section_text WHERE n_chars <= 50"
    expect: {op: "==", value: 0}
  - id: grammar-occurrences-derived
    claim: "语法 per-unit 已建(§1.2): grammar_occurrences ≥15 从教材Grammar段真相源映射课标项(curated非估算, 不命中诚实跳过)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM grammar_occurrences o WHERE o.grammar_item_id IN (SELECT grammar_item_id FROM grammar_items)"
    expect: {op: ">=", value: 15}

  # ===== D0 总门禁 (权威) =====
  - id: d0-accuracy-green
    claim: "scripts/data_accuracy_check.py 全绿 (D0 100% 准确率)"
    type: shell
    command: ["python3", "scripts/data_accuracy_check.py"]
    expect: {op: regex, pattern: "D0 100% 准确率达成"}

  # ===== 件3 趋势/考点分布/关联性 (materialize=none, 服务即时算 + D0锁) =====
  - id: exam-point-cooccur-substrate
    claim: "关联性第三条腿底料: 辽宁 ≥100 题挂≥2考点 (跨轴共现源; 件3)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM (SELECT q.question_id FROM exam_questions q JOIN edges e ON 'question:'||q.question_id=e.src_id AND e.relation='tests_exam_point' WHERE q.province LIKE '辽宁%' GROUP BY 1 HAVING count(DISTINCT e.dst_id)>=2)"
    expect: {op: ">=", value: 100}
  - id: trend-distribution-not-materialized
    claim: "趋势/分布/关联性 不落表 (materialize=none 决策; 防快照表悄悄回归致 staleness §3.5)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM information_schema.tables WHERE lower(table_name) LIKE '%exam_trend%' OR lower(table_name) LIKE '%distribution_snapshot%' OR lower(table_name) LIKE '%cooccur%'"
    expect: {op: "==", value: 0}
  - id: heatmap-route-no-inline-agg
    claim: "heatmap 路由无内联 GROUP BY (聚合下沉 services/heatmap, Rule1; 件3)"
    type: shell
    command: ["bash", "-c", "grep 'GROUP BY' backend/api/routes/heatmap.py | wc -l | tr -d ' '"]
    expect: {op: "==", value: "0"}

  # ===== 备课整合 (lesson_plan 一体视图; 词∩真题单一计算点 + 浮窗收口) =====
  - id: lesson-plan-vocab-single-source
    claim: "备课整合词∩真题为单一计算点: recommend/lesson_plan 运行时与 services.vocab 字节一致 (无双算分叉, Rule1)"
    type: shell
    command: ["bash", "-c", "python3 -c \"import duckdb,json; from backend.services import recommend,vocab,lesson_plan as L; c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True); u='unit:waiyan/bixiu_1/U1'; f=lambda o:json.dumps(o,sort_keys=True,ensure_ascii=False,default=str); a=f(recommend.unit_exam_alignment(c,u)); b=f(vocab.unit_word_exam_alignment(c,u)); d=f(L.generate_lesson_plan(c,u)['alignment_summary']); print('OK' if a==b==d else 'DRIFT')\""]
    expect: {op: regex, pattern: "OK"}
  - id: graph-popup-related-via-service
    claim: "讲课浮窗 1-hop related 走 services.graph.neighbors (Rule3 图遍历收口, _fetch_related 不再内联 edges↔nodes JOIN)"
    type: shell
    command: ["bash", "-c", "grep -q 'graph.neighbors' backend/api/routes/graph_popup.py && echo VIA_SERVICE || echo INLINE"]
    expect: {op: regex, pattern: "VIA_SERVICE"}
  - id: lesson-plan-grammar-axis
    claim: "备课整合接入语法轴: generate_lesson_plan 含 grammar 字段且 grammar_occurrences→grammar_items 0 悬挂"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM grammar_occurrences g LEFT JOIN grammar_items gi ON gi.grammar_item_id=g.grammar_item_id WHERE gi.grammar_item_id IS NULL"
    expect: {op: "==", value: 0}
  - id: lesson-plan-grammar-province-scoped
    claim: "备课语法轴真题溯源锚定辽宁卷 (§7; _grammar_exam_trace 带 province LIKE 辽宁%, 不混外省冒充辽宁备课锚)"
    type: shell
    command: ["bash", "-c", "grep -A12 'def _grammar_exam_trace' backend/services/lesson_plan.py | grep -q \"province LIKE '辽宁\" && echo SCOPED || echo LEAK"]
    expect: {op: regex, pattern: "SCOPED"}
  - id: exam-point-theme-l3-substrate
    claim: "颗粒度对齐课标第三级: 辽宁真题挂 theme_l3 子主题边 ≥80 (dual_model opus+sonnet 一致, 诚实跳过分歧)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM edges e JOIN exam_questions q ON 'question:'||q.question_id=e.src_id WHERE e.relation='tests_exam_point' AND e.dst_id LIKE 'exam_point:theme_l3:%' AND q.province LIKE '辽宁%'"
    expect: {op: ">=", value: 80}
  - id: exam-point-theme-l3-bridged
    claim: "theme_l3 节点全桥到教材 theme (4路追溯不断缝; 0 未桥)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM nodes n WHERE n.concept_id LIKE 'exam_point:theme_l3:%' AND NOT EXISTS (SELECT 1 FROM edges e WHERE e.src_id=n.concept_id AND e.relation='theme_aligns')"
    expect: {op: "==", value: 0}
  - id: graph-popup-questions-liaoning-only
    claim: "讲课浮窗真题 facet 只来自 qbank(157辽宁, §7); _fetch_questions INNER JOIN question_bank 不漏外省空行"
    type: shell
    command: ["bash", "-c", "grep -A8 'def _fetch_questions' backend/api/routes/graph_popup.py | grep -q 'INNER JOIN question_bank' && echo SCOPED || echo LEAK"]
    expect: {op: regex, pattern: "SCOPED"}
