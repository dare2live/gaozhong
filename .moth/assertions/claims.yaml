kind: assertion_pack
name: gaozhong-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-15 创立
# 规则: 任何带数字/状态的关键真相 (本 session 数据诚实性整改成果), 在这里挂一条可执行断言;
# 真相变化时同 commit 更新断言 — 弹仓漂移(红) = 回退/腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。DB 需先 init_db 建好。
assertions:
  # ===== 真题 provenance 诚实性 (L-N/L-P/L-R) =====
  - id: nonII-not-faking-liaoning
    claim: "非新课标II卷(I/III/甲/乙)不冒充辽宁 (category-aware; 辽宁只用新课标II; L-N/L-P/L-R)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE province LIKE '辽宁%' AND paper_type IN ('新课标 I 卷','新课标 III 卷','全国甲卷','全国乙卷')"
    expect: {op: "==", value: 0}
  - id: liaoning-is-xgkii
    claim: "辽宁卷 paper_type 必为新课标II卷 (辽宁 2015 起只用新课标II)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE province LIKE '辽宁%' AND paper_type <> '新课标 II 卷'"
    expect: {op: "==", value: 0}
  - id: pre2015-not-liaoning
    claim: "2010-2014 辽宁自主命题期不冒充辽宁 (gb 数据为他省新课标II)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE year <= 2014 AND province LIKE '辽宁%'"
    expect: {op: "==", value: 0}
  - id: smoking-gun-gone
    claim: "全国甲卷 'Landscape Photographer' 行不再标辽宁 (L-P smoking gun; 已随 GAOKAO 占位删除)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE raw_question LIKE '%Landscape%Photographer%' AND province LIKE '辽宁%'"
    expect: {op: "==", value: 0}
  - id: eol-truth-imported
    claim: "EOL 真题 2021/2022 辽宁新高考全国II卷已入库 110 题 (M0 真值补全, 替换 GAOKAO 占位)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo LIKE 'eol_xgkii%'"
    expect: {op: "==", value: 110}
  - id: eol-no-hard-truncation
    claim: "EOL raw_question 无 900 硬截断 (#8: snippet 去 compact 900 限, 阅读篇章全保留; len==900=smoking gun)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo LIKE 'eol_xgkii%' AND LENGTH(raw_question)=900"
    expect: {op: "==", value: 0}
  - id: local-pdf-no-watermark
    claim: "local_pdf raw_question 无页中水印bleed (坑18续: 锦宏/学科网 mock-PDF 每页页脚公众号/客服/页码 mid-passage注入污染题干; _strip_watermark 按行剥, 正文0丢失)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo='local_pdf' AND (raw_question LIKE '%锦宏教育%' OR raw_question LIKE '%学科 网（北 京）%')"
    expect: {op: "==", value: 0}
  - id: local-pdf-reproducible
    claim: "2024/2025 真题 PDF 18 题入库 (M6: init_db Layer 4g 改 in-process import_pdfs(con) 后可复现; 防 subprocess 第二写连接锁冲突回归 → local_pdf=0)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM exam_questions WHERE source_repo = 'local_pdf'"
    expect: {op: "==", value: 18}

  # ===== init_db 全量重建鲁棒性 (M6: git 非 ASCII 路径 + file_manifest) =====
  - id: manifest-nonascii-ok
    claim: "中文名文件正确入 file_manifest (M6: load.py 用 git ls-files -z; 防 quotepath 八进制引号致 init_db 崩回归)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM file_manifest WHERE rel_path LIKE '%上海市初中%'"
    expect: {op: "==", value: 1}

  # ===== 学情派生诚实性 (无假推) =====
  - id: weakness-derived-no-orphan
    claim: "student_weakness 全有 student_answers 在该真考点上的错题支撑 (2026-06-16改: 弱点维度=exam_point真考点非word token; 0 orphan)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM student_weakness w WHERE NOT EXISTS (SELECT 1 FROM student_answers sa JOIN question_bank qb ON qb.qb_id=sa.question_id::BIGINT JOIN edges e ON e.src_id=('question:'||qb.origin_ref) AND e.relation='tests_exam_point' WHERE sa.student_id=w.student_id AND e.dst_id=w.concept_id)"
    expect: {op: "==", value: 0}
  - id: weakness-is-exam-point
    claim: "学情薄弱环节维度=exam_point真考点(非word token假象; critic#2修复, 错题→真考点→薄弱)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM student_weakness WHERE concept_id NOT LIKE 'exam_point:%'"
    expect: {op: "==", value: 0}

  # ===== Phase 7 生成层回滚 (仅真题, 无生成范文) =====
  - id: qbank-real-only
    claim: "question_bank 仅真题, 无合成/生成练习 (Phase 7 回滚; 回退=生成层复活)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM question_bank WHERE origin <> 'real'"
    expect: {op: "==", value: 0}
  - id: course-handouts-empty
    claim: "course_handouts 空 (讲义生成范文已回滚; 教材基石完善前不重建)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM course_handouts"
    expect: {op: "==", value: 0}
  - id: enriched-content-deleted
    claim: "backend/config/enriched_content/ 生成讲义 yaml 已删 (Phase 7 回滚)"
    type: shell
    command: ["bash", "-c", "ls backend/config/enriched_content/*.yaml 2>/dev/null | wc -l | tr -d ' '"]
    expect: {op: "==", value: "0"}

  # ===== 停用词污染清洗 (L-U) =====
  - id: no-stopword-tags
    claim: "question_tags 无功能词 tag (the/it/to/they; L-U 停用词清洗)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM question_tags WHERE tag_id IN ('word:the','word:it','word:to','word:they','word:of','word:a','word:is','word:and')"
    expect: {op: "==", value: 0}
  - id: stopwords-config-present
    claim: "停用词表数据化在 config/stopwords.yaml (§3.5 规则不 hardcode)"
    type: shell
    command: ["grep", "-c", "english_stopwords", "backend/config/stopwords.yaml"]
    expect: {op: ">=", value: 1}
  - id: year-weights-matches-constitution
    claim: "year_weights.yaml 操作型权重 == 宪法铁律P1字面 {2025:5..2021:1.5} (G1 去硬编码: 5副本收口单点; verify-the-verifier 坑1+接孤儿门进门2 坑21)"
    type: shell
    command: ["python3", "-c", "from scripts.tools.audit.model_capability_audit import _check_weight_compliance as c; print(len(c()['mismatches']))"]
    expect: {op: "==", value: "0"}
  - id: skill-map-yaml-single-point
    claim: "cognitive_skill _SKILL_MAP 收口 exam_point_taxonomy.yaml 单点 (G4); 题型→技能 ≥9条 + target ⊆ 官方7理解性技能 (坑16 防非官方漂移; 独立官方7字面量校验)"
    type: shell
    command: ["python3", "-c", "from backend.services.exam_point.cognitive_skill import _load_skill_map as f; m=f(); off={'推断','理解具体信息','理解主旨要义','理解词汇','理解观点态度','理解目的','理解文章结构类型'}; print(0 if (len(m)>=9 and set(m.values())<=off) else 1)"]
    expect: {op: "==", value: "0"}
  - id: gaokao-structure-yaml-single-point
    claim: "高考卷面结构收口 question_types.yaml 单点 (G6); 6计分题型总分150, weight派生score/总分现算 (exam_alignment_checker GAOKAO_STRUCTURE 不再硬编码)"
    type: shell
    command: ["python3", "-c", "from scripts.tools.alignment.exam_alignment_checker import GAOKAO_STRUCTURE as G; print(0 if (len(G)==6 and sum(v['score'] for v in G.values())==150) else 1)"]
    expect: {op: "==", value: "0"}
  - id: liaoning-label-single-point
    claim: "辽宁卷 province 标签收口 scope 单点 (G3); 5消费者(exam_paper/exam_province/eol_import/pdf/truth_baseline_load)全解析到同一 scope.LIAONING_XGKII_2021 (坑3/坑7 防散落漂移)"
    type: shell
    command: ["python3", "-c", "from backend.services.trend import scope; from backend.services.data_sources.clean.exam_paper import LN_II_2021; from backend.services.extraction.exam_province import LABEL_XGKII_LN; from backend.services.imports.eol_import import PROVINCE; print(0 if (LN_II_2021==LABEL_XGKII_LN==PROVINCE==scope.LIAONING_XGKII_2021=='辽宁 (新课标 II 卷, 2021+)') else 1)"]
    expect: {op: "==", value: "0"}

  # ===== 分析诚实 (件1: D0 从"数据诚实"扩展到"分析诚实") =====
  - id: trend-province-scoped
    claim: "命题趋势默认锚定辽宁卷 + 样本量护栏 (件1; 防混284全国卷/薄样本伪装趋势回归)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services import trend;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);r=trend.question_type_year_trend(c)[0];print('OK' if r.get('province_scope')=='辽宁卷' and 'reliable' in r else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}
  - id: trend-summary-anchored
    claim: "trend_summary 锚定辽宁卷 + 带样本量诊断 (前端首页趋势不混全国卷)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services import trend;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);s=trend.trend_summary(c);print('OK' if s.get('province_scope')=='辽宁卷' and 'sample_diagnosis' in s else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}
  - id: practice-not-prediction
    claim: "练习卷不冒充'预测/押题': 趋势不可信(辽宁样本不足)时退回蓝图固定占比, 不按 slope 加权 (REVISE predicted.py)"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services.exercise.predicted import generate_blueprint_practice_paper as g;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);p=g(c,total=10);b=p['composition_basis']['selection_basis'];print('OK' if 'blueprint_fixed' in b and p['paper_type']=='blueprint_structured_practice' else 'FAIL')"]
    expect: {op: regex, pattern: "OK"}

  # ===== 词×真题考过状态 单一计算点 (#12/#13/#14: exam_vocab 唯一 tokenizer + exam_coverage 唯一 writer) =====
  - id: exam-status-province-scoped
    claim: "词 exam_status 辽宁口径 (§7, #13): 无 core/HV_extra 节点而辽宁命中(gaokao_hit_count_ln)=0 — 不混外省冒充辽宁考过"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM nodes WHERE node_type='word' AND json_extract_string(attrs_json,'exam_status') IN ('core','HV_extra') AND COALESCE(TRY_CAST(json_extract_string(attrs_json,'gaokao_hit_count_ln') AS BIGINT),0)=0"
    expect: {op: "==", value: 0}
  - id: exam-status-3source-consistent
    claim: "3源一致 (#12): node HV_extra 数 == vocab_classification.jsonl『真超纲·辽宁考过』数 (单一计算点收敛, 三处不再各算矛盾)"
    type: shell
    command: ["python3", "-c", "import duckdb,json;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);nh=c.execute(\"SELECT count(*) FROM nodes WHERE node_type='word' AND json_extract_string(attrs_json,'exam_status')='HV_extra'\").fetchone()[0];jl=sum(1 for L in open('data/structured/vocab_classification.jsonl',encoding='utf-8') if L.strip() and json.loads(L).get('category')=='真超纲·辽宁考过');print('OK' if nh==jl else 'MISMATCH nh=%d jl=%d'%(nh,jl))"]
    expect: {op: regex, pattern: "OK"}
  - id: gaokao-hit-count-ln-retained
    claim: "gaokao_hit_count_ln 在 word 节点留存>0 (#14: exam_coverage 单一 writer 一次写全, 不再被 extracurricular 整段 UPDATE 覆盖)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM nodes WHERE node_type='word' AND json_extract_string(attrs_json,'gaokao_hit_count_ln') IS NOT NULL"
    expect: {op: ">", value: 0}

  # ===== 考点 canonical 维度 (件2 拱心石: 取代 word-token 冒充考点) =====
  - id: exam-point-edges-present
    claim: "考点 canonical 维度已落库: tests_exam_point 边 ≥300 (dual_model标注批次188 labels, B1去重后落177辽宁题节点 genre/theme)"
    type: duckdb_sql
    database: data/db/gaozhong.duckdb
    query: "SELECT count(*) FROM edges WHERE relation = 'tests_exam_point'"
    expect: {op: ">=", value: 300}
  - id: exam-dictionary-canonical
    claim: "考试词典(Canonical词本体): exam_vocabulary ~4186词=课标∪教材真超纲(最小无注水), ≥99%有释义(教材→中考表→COCA→变体规范形继承), gloss_source可溯; 每无释义词必登记word_variants.unglossable(缩写/专名, 破自洽棘轮); photosynthesis真题生词不入(最准)"
    type: shell
    command: ["python3", "-c", "import duckdb,yaml;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);n=c.execute('SELECT COUNT(*) FROM exam_vocabulary').fetchone()[0];cov=c.execute('SELECT COUNT(*) FROM exam_vocabulary WHERE gloss IS NOT NULL').fetchone()[0];nosrc=c.execute('SELECT COUNT(*) FROM exam_vocabulary WHERE NOT (in_curriculum OR in_textbook)').fetchone()[0];ph=c.execute(\"SELECT COUNT(*) FROM exam_vocabulary WHERE word='photosynthesis'\").fetchone()[0];gl=set(r[0] for r in c.execute('SELECT word FROM exam_vocabulary WHERE gloss IS NULL').fetchall());c.close();ung=set((yaml.safe_load(open('backend/config/word_variants.yaml',encoding='utf-8')).get('unglossable') or {}));print('OK' if 3500<=n<=5000 and nosrc==0 and ph==0 and cov*100>=n*99 and gl<=ung else f'FAIL {n} {cov} {nosrc} {ph} {gl-ung}')"]
    expect: {op: regex, pattern: "OK"}
  - id: theme-vocab-distinctive
    claim: "主题特征词汇(词汇↔主题关联): characterizes_theme 49边辽宁区分度(artist→文艺/plastic→环境, 功能词get/make已滤坑5); provenance=启发式诚实标"
    type: shell
    command: ["python3", "-c", "import duckdb;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);n=c.execute(\"SELECT COUNT(*) FROM edges WHERE relation='characterizes_theme'\").fetchone()[0];s=c.execute(\"SELECT COUNT(*) FROM edges e JOIN nodes n ON n.concept_id=e.dst_id WHERE e.relation='characterizes_theme' AND e.src_id='word:plastic' AND n.label='环境保护'\").fetchone()[0];c.close();print('OK' if n>=30 and s==1 else f'FAIL {n} {s}')"]
    expect: {op: regex, pattern: "OK"}
  - id: cooccur-materialized
    claim: "考点共现关联性入图(件3第三腿): co_occurs 19边跨维(genre×theme_l2/context)+era分层(PIT); 记叙文×人与社会等辽宁命题模式成图一等公民; 单算点service+持久化 (删杜撰theme_l3共现27条后, 原46)"
    type: shell
    command: ["python3", "-c", "import duckdb;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);n=c.execute(\"SELECT COUNT(*) FROM edges WHERE relation='co_occurs'\").fetchone()[0];s=c.execute(\"SELECT COUNT(*) FROM edges e JOIN nodes a ON a.concept_id=e.src_id JOIN nodes b ON b.concept_id=e.dst_id WHERE e.relation='co_occurs' AND ((a.label='记叙文' AND b.label='人与社会') OR (a.label='人与社会' AND b.label='记叙文'))\").fetchone()[0];c.close();print('OK' if n>=15 and s==1 else f'FAIL {n} {s}')"]
    expect: {op: regex, pattern: "OK"}
  - id: word-sense-cross-stage
    claim: "word_sense本体(master A1): 142确认跨阶段多义词→284节点+142 expands_sense边(初中→高中); 双模型判断+对抗验证(坑16过度检测305→142); ceiling天花板→上限新义"
    type: shell
    command: ["python3", "-c", "import duckdb;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);ns=c.execute(\"SELECT COUNT(*) FROM nodes WHERE node_type='word_sense'\").fetchone()[0];ex=c.execute(\"SELECT COUNT(*) FROM edges WHERE relation='expands_sense'\").fetchone()[0];ce=c.execute(\"SELECT attrs_json FROM nodes WHERE concept_id='word_sense:ceiling:高中'\").fetchone();c.close();print('OK' if ns==2*ex and ex>=100 and ce and '上限' in ce[0] else f'FAIL {ns} {ex}')"]
    expect: {op: regex, pattern: "OK"}
  - id: glossary-cross-stage-senses
    claim: "释义词典(word_sense地基): word_glosses 跨阶段候选≥300词(初中∩高中有释义); 释义来自教材生词表+中考词汇表(课标无释义), power初中能量义+高中电力新义"
    type: shell
    command: ["python3", "-c", "import duckdb;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);x=c.execute(\"SELECT COUNT(*) FROM (SELECT word FROM word_glosses WHERE stage='初中' INTERSECT SELECT word FROM word_glosses WHERE stage LIKE '高中%')\").fetchone()[0];hs=' '.join(r[0] for r in c.execute(\"SELECT gloss FROM word_glosses WHERE word='power' AND stage LIKE '高中%'\").fetchall());c.close();print('OK' if x>=300 and '电力' in hs else f'FAIL {x}')"]
    expect: {op: regex, pattern: "OK"}
  - id: cross-stage-at-stage-refined
    claim: "跨年级分阶: at_stage 边精确匹配 refined_stage (3095词0错指; 细分阶非粗义务教育). verify-the-verifier: 红队'DB粗分阶'误读, 边早已细, 真消费只读边"
    type: shell
    command: ["python3", "-c", "import duckdb,json;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);rs={json.loads(l)['word']:json.loads(l)['refined_stage'] for l in open('data/junior_high/structured/stage_refined.jsonl') if l.strip()};real={w:s for w,s in rs.items() if s in {'小学','初中','义务教育','高中必修','高中选修'}};bad=sum(1 for w,s in real.items() if ('stage:'+s) not in {r[0] for r in c.execute(\"SELECT dst_id FROM edges WHERE relation='at_stage' AND src_id=?\",['word:'+w]).fetchall()});c.close();print('OK' if bad==0 and len(real)>=3000 else f'FAIL {bad}')"]
    expect: {op: regex, pattern: "OK"}
  - id: cognitive-skill-goldmine
    claim: "设问类型金矿(KG-A1)跨era: cognitive_skill 100边(2015-20旧课标II 85六年全覆盖 + 2023新高考II 15; 真值锚剔2021甲卷§7); 命题哲学迁移真值=推断占比 新era(46.7%)>旧era(28.2%, 坑16新高考重推断), 新era n=15方向性诚实标; 全explicit_label+血缘"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services.exam_point import cognitive_skill_distribution as f;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);d=f(c);c.close();tot=d['n_total'];g=lambda k:next((p['pct'] for e,pts in d['by_era'].items() if e.startswith(k) for p in pts if p['label']=='推断'),0);print('OK' if tot==100 and g('2021')>g('2015-2020')>0 else f'FAIL tot={tot} old={g(\"2015-2020\")} new={g(\"2021\")}')"]
    expect: {op: regex, pattern: "OK"}
  - id: cognitive-skill-by-content-cross
    claim: "设问技能×题材交叉(2015-20截面): join命中74(genre)/'question:'||passage_label对齐, era锁2015-20(2021+桥缺失不出迁移), 异质provenance分层(技能=explicit_label真值/题材=dual_model_agree模型推断非真值交叉); 结构真值=应用文100%理解具体信息(0推断)/说明文最考推断"
    type: shell
    command: ["python3", "-c", "import duckdb;from backend.services.exam_point import cognitive_skill_by_content as f;c=duckdb.connect('data/db/gaozhong.duckdb',read_only=True);d=f(c,'genre');c.close();yw=d['by_content'].get('应用文',{}).get('skills',[]);top=yw[0]['label'] if yw else '?';ok=d['n_matched']==74 and d['era']=='2015-2020_旧课标II' and 'dual_model_agree' in d['content_provenance'] and top=='理解具体信息' and len(yw)==1;print('OK' if ok else f'FAIL match={d[\"n_matched\"]} era={d[\"era\"]} 应用文top={top}')"]
    expect: {op: regex, pattern: "OK"}
  - id: l4-paper-liaoning-only
